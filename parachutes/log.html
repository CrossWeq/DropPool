<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropPool Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <style>
        html, body { background-color: #0a0f1c !important; color: #f8fafc; min-height: 100vh; opacity: 1 !important; }
        .tab-btn.active { border-bottom-color: #3b82f6; color: #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto mt-4">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 pr-20 relative">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                    <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span data-i18n="title">DropPool İstatistik Merkezi</span>
                </h1>
                <p class="text-gray-400 mt-2 text-sm" data-i18n="desc">Tüm zamanların oyuncu istatistikleri ve anlık olay geçmişi.</p>
            </div>
            
            <div class="flex gap-3 items-center">
                <button type="button" id="langBtn" onclick="toggleLang()" class="bg-black/40 border border-gray-700/50 text-white font-bold py-2.5 px-4 rounded-xl hover:bg-white/10 transition-colors shadow-lg">ENG</button>
                <button onclick="clearAllData()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 px-5 py-2.5 rounded-xl font-medium transition-colors text-sm">
                    <span data-i18n="clearBtn">Tüm Verileri Sıfırla</span>
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-800 mb-8">
            <button onclick="switchTab('statsTab')" id="btn-statsTab" class="tab-btn active px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors" data-i18n="tabStats">Oyuncu İstatistikleri</button>
            <button onclick="switchTab('logsTab')" id="btn-logsTab" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors" data-i18n="tabLogs">Canlı Olay Akışı (Log)</button>
        </div>

        <!-- STATS TAB -->
        <div id="statsTab" class="tab-content active">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left: All Users Table -->
                <div class="lg:col-span-2">
                    <div class="bg-gray-900/50 border border-gray-800 rounded-2xl overflow-hidden backdrop-blur-xl flex flex-col h-[600px]">
                        <div class="p-4 border-b border-gray-800 bg-black/20 flex justify-between items-center">
                            <h2 class="text-lg font-bold text-white" data-i18n="allPlayers">Tüm Oyuncular</h2>
                            <div class="relative w-64">
                                <input type="text" id="searchInput" onkeyup="filterStats()" placeholder="Kullanıcı Ara..." class="w-full bg-black/40 border border-gray-700/50 rounded-lg px-4 py-2 pl-10 focus:outline-none focus:border-indigo-500 text-sm text-white">
                                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                        </div>
                        <div class="overflow-y-auto flex-1">
                            <table class="w-full text-left border-collapse">
                                <thead class="sticky top-0 bg-gray-900 border-b border-gray-800 z-10">
                                    <tr class="text-xs uppercase tracking-wider text-gray-400">
                                        <th class="px-6 py-4 font-semibold" data-i18n="thUser">Kullanıcı Adı</th>
                                        <th class="px-6 py-4 font-semibold text-center" data-i18n="thJumps">Toplam Atlayış</th>
                                        <th class="px-6 py-4 font-semibold text-right" data-i18n="thScore">Rekor Puan</th>
                                    </tr>
                                </thead>
                                <tbody id="statsTableBody" class="divide-y divide-gray-800/50 text-sm">
                                    <!-- JS populated -->
                                </tbody>
                            </table>
                            <div id="statsEmpty" class="hidden py-16 text-center">
                                <p class="text-gray-500 font-medium" data-i18n="noStats">Henüz istatistik bulunmuyor.</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right: Top 10 -->
                <div class="lg:col-span-1">
                    <div class="bg-gradient-to-b from-indigo-900/40 to-gray-900/50 border border-indigo-500/20 rounded-2xl overflow-hidden backdrop-blur-xl h-full flex flex-col">
                        <div class="p-5 border-b border-indigo-500/20 bg-black/20 flex flex-col items-center justify-center gap-2 text-center">
                            <h2 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200" data-i18n="top10">Tüm Zamanların Top 10'u</h2>
                        </div>
                        <div class="p-4 flex-1 overflow-y-auto">
                            <ul id="top10List" class="space-y-2">
                                <!-- JS populated -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOGS TAB -->
        <div id="logsTab" class="tab-content">
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl overflow-hidden backdrop-blur-xl h-[600px] flex flex-col">
                <div class="p-4 border-b border-gray-800 bg-black/20">
                    <p class="text-sm text-gray-400" data-i18n="logLimit">Sadece son 500 olay (Zaman Tüneli)</p>
                </div>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-gray-900 border-b border-gray-800 z-10">
                            <tr class="text-xs uppercase tracking-wider text-gray-400">
                                <th class="px-6 py-4 font-semibold" data-i18n="thDate">Tarih / Saat</th>
                                <th class="px-6 py-4 font-semibold" data-i18n="thUser">Kullanıcı</th>
                                <th class="px-6 py-4 font-semibold" data-i18n="thAction">Olay</th>
                                <th class="px-6 py-4 font-semibold" data-i18n="thDetail">Detay</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y divide-gray-800/50 text-sm">
                        </tbody>
                    </table>
                    <div id="emptyState" class="hidden py-16 text-center">
                        <p class="text-gray-500 font-medium" data-i18n="noLogs">Henüz hiçbir kayıt yok.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const i18n = {
            title: { tr: "DropPool İstatistik Merkezi", en: "DropPool Stats Center" },
            desc: { tr: "Tüm zamanların oyuncu istatistikleri ve anlık olay geçmişi.", en: "All-time player statistics and live event history." },
            clearBtn: { tr: "Tüm Verileri Sıfırla", en: "Reset All Data" },
            tabStats: { tr: "Oyuncu İstatistikleri", en: "Player Stats" },
            tabLogs: { tr: "Canlı Olay Akışı (Log)", en: "Live Event Log" },
            allPlayers: { tr: "Tüm Oyuncular", en: "All Players" },
            thUser: { tr: "Kullanıcı Adı", en: "Username" },
            thJumps: { tr: "Toplam Atlayış", en: "Total Drops" },
            thScore: { tr: "Rekor Puan", en: "Best Score" },
            noStats: { tr: "Henüz istatistik bulunmuyor.", en: "No statistics available yet." },
            top10: { tr: "Tüm Zamanların Top 10'u", en: "All-Time Top 10" },
            logLimit: { tr: "Sadece son 500 olay (Zaman Tüneli)", en: "Only last 500 events (Timeline)" },
            thDate: { tr: "Tarih / Saat", en: "Date / Time" },
            thAction: { tr: "Olay", en: "Event" },
            thDetail: { tr: "Detay", en: "Detail" },
            noLogs: { tr: "Henüz hiçbir kayıt yok.", en: "No logs available yet." },
            searchPlaceholder: { tr: "Kullanıcı Ara...", en: "Search user..." },
            confirmClear: { tr: "TÜM İSTATİSTİKLERİ VE GEÇMİŞİ SİLMEK İSTEDİĞİNİZE EMİN MİSİNİZ? (Atlayış sayıları ve rekorlar dahil her şey sıfırlanır!)", en: "ARE YOU SURE YOU WANT TO CLEAR ALL STATS AND HISTORY? (Everything including jump counts and records will be reset!)" },
            badges: {
                JUMP: { tr: 'ATLAYIŞ', en: 'JUMP' },
                SCORE: { tr: 'PUAN', en: 'SCORE' },
                SYSTEM: { tr: 'SİSTEM', en: 'SYSTEM' }
            }
        };

        let lang = 'tr';

        function toggleLang() {
            lang = lang === 'tr' ? 'en' : 'tr';
            document.getElementById('langBtn').innerText = lang === 'tr' ? 'ENG' : 'TR';
            
            // Update static text
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[key]) {
                    el.innerText = i18n[key][lang];
                }
            });

            // Update placeholders
            document.getElementById('searchInput').placeholder = i18n.searchPlaceholder[lang];

            // Re-render data to translate dynamic contents (badges, empty states)
            renderLogs();
            renderStats();
        }

        const syncChannel = new BroadcastChannel('droppool_channel');
        let logs = [];
        let statsData = {};

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        function loadData() {
            try {
                const l = localStorage.getItem('droppool_logs');
                logs = l ? JSON.parse(l) : [];
            } catch (e) { logs = []; }
            
            try {
                const s = localStorage.getItem('droppool_stats');
                statsData = s ? JSON.parse(s) : {};
            } catch (e) { statsData = {}; }

            renderLogs();
            renderStats();
        }

        function translateLogDetail(detail, l) {
            if (l === 'tr') return detail;
            let d = detail;
            d = d.replace('puan aldı (Havuza indi).', 'points received (Landed in pool).');
            d = d.replace('Havuzu ıskaladı (Dışarı düştü).', 'Missed the pool (Landed outside).');
            d = d.replace('!resetdrop ile tüm süreleri ve sıralamayı sıfırladı.', 'Reset all cooldowns and leaderboard via !resetdrop.');
            d = d.replace('!droptogether modunu aktif etti.', 'Activated !droptogether mode.');
            d = d.replace('Toplu atlayış (Uçak) başlattı!', 'Started mass drop (Plane)!');
            d = d.replace('Toplu atlayış (Uçak) için sıraya girdi.', 'Queued for mass drop (Plane).');
            d = d.replace('Özel atlayış (Helikopter) başlattı.', 'Started special drop (Helicopter).');
            
            d = d.replace(' atlayış başlattı.', ' drop started.');
            d = d.replace('Normal', 'Standard');
            d = d.replace('Sahte', 'Fake');
            d = d.replace('Sarhoş', 'Drunk');
            d = d.replace('Dalış', 'Dive');
            
            return d;
        }

        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            const emptyState = document.getElementById('emptyState');
            if (logs.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            let html = '';
            for (let i = logs.length - 1; i >= 0; i--) {
                const log = logs[i];
                let actionBadge = '';
                
                if(log.action === 'ATLAYIŞ') {
                    actionBadge = `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-md text-xs font-bold">${i18n.badges.JUMP[lang]}</span>`;
                }
                else if(log.action === 'PUAN') {
                    actionBadge = `<span class="bg-green-500/10 text-green-400 border border-green-500/20 px-2.5 py-1 rounded-md text-xs font-bold">${i18n.badges.SCORE[lang]}</span>`;
                }
                else if(log.action === 'SİSTEM') {
                    actionBadge = `<span class="bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2.5 py-1 rounded-md text-xs font-bold">${i18n.badges.SYSTEM[lang]}</span>`;
                }
                else {
                    actionBadge = `<span class="bg-gray-500/10 text-gray-400 border border-gray-500/20 px-2.5 py-1 rounded-md text-xs font-bold">${log.action}</span>`;
                }

                let translatedDetail = translateLogDetail(log.detail, lang);

                html += `
                    <tr class="hover:bg-white/5 transition-colors group">
                        <td class="px-6 py-4 whitespace-nowrap text-gray-400 font-mono text-xs">${log.time}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-white">${log.username}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${actionBadge}</td>
                        <td class="px-6 py-4 text-gray-300 max-w-md truncate">${translatedDetail}</td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function renderStats() {
            const tbody = document.getElementById('statsTableBody');
            const empty = document.getElementById('statsEmpty');
            const top10 = document.getElementById('top10List');
            
            const users = Object.values(statsData);
            if(users.length === 0) {
                tbody.innerHTML = '';
                top10.innerHTML = `<li class="text-gray-500 text-center py-4 text-sm">${i18n.noLogs[lang]}</li>`;
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            // --- Top 10 ---
            const sortedByScore = [...users].sort((a,b) => b.maxScore - a.maxScore).slice(0, 10);
            let top10Html = '';
            sortedByScore.forEach((u, index) => {
                let medal = `${index+1}.`;
                let bgClass = 'bg-white/5 hover:bg-white/10';
                if(index === 0) { medal = '🥇'; bgClass = 'bg-yellow-500/20 border-yellow-500/30 border hover:bg-yellow-500/30'; }
                if(index === 1) { medal = '🥈'; bgClass = 'bg-gray-300/20 border-gray-300/30 border hover:bg-gray-300/30'; }
                if(index === 2) { medal = '🥉'; bgClass = 'bg-orange-600/20 border-orange-600/30 border hover:bg-orange-600/30'; }
                
                top10Html += `
                    <li class="flex justify-between items-center px-4 py-3 rounded-xl transition-colors ${bgClass}">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-lg w-7 text-center ${index<3?'text-white':'text-gray-500'}">${medal}</span>
                            <span class="font-medium text-white">${u.username}</span>
                        </div>
                        <span class="font-bold text-green-400">${u.maxScore.toFixed(2)}</span>
                    </li>
                `;
            });
            top10.innerHTML = top10Html;

            // --- All Users Table ---
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(u => u.username.toLowerCase().includes(query));
            
            filteredUsers.sort((a,b) => b.jumps - a.jumps);
            
            let statsHtml = '';
            filteredUsers.forEach(u => {
                statsHtml += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-white">${u.username}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center text-blue-400 font-bold">${u.jumps}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-green-400 font-bold">${u.maxScore.toFixed(2)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = statsHtml;
        }

        function filterStats() {
            renderStats();
        }

        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'NEW_LOG') {
                logs.push(event.data.log);
                if (logs.length > 500) logs = logs.slice(logs.length - 500);
                if(document.getElementById('logsTab').classList.contains('active')) renderLogs();
            } else if (event.data && event.data.type === 'STATS_UPDATE') {
                statsData = event.data.stats;
                if(document.getElementById('statsTab').classList.contains('active')) renderStats();
            } else if (event.data && event.data.type === 'CLEAR_LOGS') {
                logs = [];
                statsData = {};
                renderLogs();
                renderStats();
            }
        };

        window.addEventListener('storage', (event) => {
            if (event.key === 'droppool_logs' || event.key === 'droppool_stats') {
                loadData();
            }
        });

        function clearAllData() {
            if(confirm(i18n.confirmClear[lang])) {
                logs = [];
                statsData = {};
                localStorage.removeItem('droppool_logs');
                localStorage.removeItem('droppool_stats');
                syncChannel.postMessage({ type: 'CLEAR_LOGS' });
                renderLogs();
                renderStats();
            }
        }

        loadData();
    </script>
</body>
</html>
