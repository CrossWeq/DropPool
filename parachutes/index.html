<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Chat Etkileşimli Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* OBS'te arkaplanın şeffaf olması için zorunlu */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            background-repeat: repeat-x;
            opacity: 0;
            /* Sayfa yenilendiğinde ilk açılışta yanıp sönmeyi (flash) önler */
        }

        /* Canvas tüm ekranı (OBS kaynağını) kaplasın */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Matter.js fizik motoru CDN üzerinden dahil ediliyor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Pusher JS kütüphanesi (Kick Chat için) -->
    <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
</head>

<body>

    <script>
        // --- 1. AYARLAR VE DEĞİŞKENLER ---
        const urlParams = new URLSearchParams(window.location.search);
        const channelName = urlParams.get('kanal') || 'testkanal';
        const commandStr = urlParams.get('cmd') || '!atla';
        const cooldownSec = parseFloat(urlParams.get('cd')) || 60;
        const showBackground = urlParams.get('bg') !== '0'; // Varsayılan olarak true (1)

        const activeThemesParams = urlParams.get('t') ? urlParams.get('t').split(',') : ['0', '1', '2', '3'];
        const activeThemesIndices = activeThemesParams.map(Number);

        const activeParachutesParams = urlParams.get('p') ? urlParams.get('p').split(',') : ['11', '12', '13', '14', '15', '16', '17', '18'];
        const activeParachutes = activeParachutesParams.map(Number);

        const userCooldowns = new Map();

        function checkCooldown(username) {
            if (cooldownSec <= 0) return true;
            const now = Date.now();
            const lastTime = userCooldowns.get(username);
            if (!lastTime || (now - lastTime) >= cooldownSec * 1000) {
                userCooldowns.set(username, now);
                return true;
            }
            return false;
        }

        console.log(`Bağlanılan kanal: ${channelName} | Komut: ${commandStr} | Cooldown: ${cooldownSec}s`);

        // --- TEMA VE OVERLAY GÖRÜNÜRLÜK SİSTEMİ ---
        const themes = [
            { bg: 'pixelgrass.png', pool: 'pixelpool.png', bgOffset: 150 },
            { bg: 'pixelautumn.png', pool: 'pixelpoolautumn.png', bgOffset: 250 },
            { bg: 'pixelice.png', pool: 'pixelpoolice.png', bgOffset: 90 },
            { bg: 'pixelhell.png', pool: 'pixelpoolhell.png', bgOffset: 220 }
        ];

        let isOverlayVisible = false;
        document.body.style.opacity = '0'; // Başlangıçta gizli
        document.body.style.transition = 'none'; // İlk başta geçiş yok

        let overlayIdleTimer = null;
        // Idle timer'a artık gerek yok çünkü aktif karakter bittiğinde kapanıyor, ama fonksiyonu boş bırakıyoruz
        function resetIdleTimer() {
        }

        function applyRandomTheme() {
            const activeThemesArr = themes.filter((t, index) => activeThemesIndices.includes(index));
            const listToUse = activeThemesArr.length > 0 ? activeThemesArr : themes;
            const randomTheme = listToUse[Math.floor(Math.random() * listToUse.length)];
            
            if (showBackground) {
                document.body.style.backgroundImage = `url('${randomTheme.bg}')`;
                document.body.style.backgroundPosition = `center calc(100% + ${randomTheme.bgOffset}px)`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            // Eğer pool objesi daha önceden oluşturulmuşsa görselini de değiştir
            if (typeof pool !== 'undefined' && pool.render && pool.render.sprite) {
                pool.render.sprite.texture = randomTheme.pool;

                // Havuza özel scale varsa onu kullan, yoksa standart 0.14 kullan
                const scale = randomTheme.poolScale !== undefined ? randomTheme.poolScale : 0.14;
                pool.render.sprite.xScale = scale;
                pool.render.sprite.yScale = scale;
            }
            console.log("Yeni takım teması uygulandı:", randomTheme.bg, "Offset:", randomTheme.bgOffset);
        }

        // --- ATLA SIRALAMASI SİSTEMİ & OBS SENKRONİZASYONU ---
        const syncChannel = new BroadcastChannel('droppool_channel');
        let leaderboard = []; // Her sayfa yenilendiğinde sıfırdan başlar

        // --- TOPLU ATLAYIŞ (DROP TOGETHER) DURUM DEĞİŞKENLERİ ---
        let isDropTogetherMode = false;
        let dropTogetherQueue = [];
        let isPlaneFlying = false;

        // Sayfa her açıldığında/yenilendiğinde sıralamayı sıfırla ve siralama.html'e bildir
        try {
            localStorage.removeItem('droppool_leaderboard');
        } catch (e) { }
        syncChannel.postMessage({ type: 'LEADERBOARD_RESET' });

        function updateLeaderboard(username, score) {
            score = parseFloat(score);
            if (isNaN(score)) return;

            const existingIndex = leaderboard.findIndex(x => x.username.toLowerCase() === username.toLowerCase());
            if (existingIndex !== -1) {
                // Kullanıcının daha önceki skorundan yüksekse güncelle
                if (score > leaderboard[existingIndex].score) {
                    leaderboard[existingIndex].score = score;
                }
            } else {
                leaderboard.push({ username, score });
            }

            // Puana göre büyükten küçüğe sırala ve en iyi 5'i tut
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);

            try {
                localStorage.setItem('droppool_leaderboard', JSON.stringify(leaderboard));
            } catch (e) { }
            syncChannel.postMessage({ type: 'LEADERBOARD_UPDATE', leaderboard });
        }

        // Sıralamayı manuel sıfırlamak için global fonksiyon
        window.resetLeaderboard = function () {
            leaderboard = [];
            try {
                localStorage.removeItem('droppool_leaderboard');
            } catch (e) { }
            syncChannel.postMessage({ type: 'LEADERBOARD_RESET' });
            console.log("Atla Sıralaması sıfırlandı!");
        };

        // --- 2. MATTER.JS KURULUMU ---
        const Engine = Matter.Engine,
            Render = Matter.Render,
            Runner = Matter.Runner,
            Bodies = Matter.Bodies,
            Composite = Matter.Composite,
            Events = Matter.Events,
            Body = Matter.Body,
            Constraint = Matter.Constraint,
            Composites = Matter.Composites;

        // Fizik motorunu oluştur
        const engine = Engine.create();
        const world = engine.world;

        // Render (Çizim) modülünü oluştur
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false, // Gerçekçi görünümler (renk/texture) kullanılsın
                background: 'transparent' // Render arkaplanı da şeffaf olsun
            }
        });

        Render.run(render);

        // Fizik simülasyonunu başlat
        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- 3. DUVARLAR VE ZEMİN (ÇEVRE) ---
        const width = window.innerWidth;
        const height = window.innerHeight;
        const wallThickness = 60;

        // Sol Duvar (Görünmez, zıplama/sekme katsayısı yüksek)
        const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, {
            isStatic: true,
            restitution: 0.9, // Çarpınca çok seksin
            render: { visible: false } // Ekranda görünmesin
        });

        // Sağ Duvar (Görünmez, zıplama/sekme katsayısı yüksek)
        const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, {
            isStatic: true,
            restitution: 0.9,
            render: { visible: false }
        });

        // Genel Zemin (Havuzu tutturamayanların düşeceği görünmez düz zemin)
        const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width, wallThickness, {
            isStatic: true,
            isSensor: false,
            label: 'zemin',
            render: { visible: false }
        });

        // Havuz Görseli ve Hitbox Ayarları (Görsel biraz daha küçültüldü)
        const poolSpriteScale = 0.14;
        const poolHitboxRadiusX = 120; // Görsel havuzun su yüzeyi yarıçapı (~240px genişlik)
        const poolHitboxRadiusY = 32;  // Havuzun elips derinliği

        // Havuzun sağa sola rastgele (random) doğması için güvenli X ekseni aralığı
        const poolMargin = poolHitboxRadiusX + 60;
        const randomPoolX = Math.random() * (width - poolMargin * 2) + poolMargin;

        const pool = Bodies.circle(randomPoolX, height - 35, poolHitboxRadiusX, {
            isStatic: true,
            isSensor: false,
            label: 'hedefZemin',
            render: {
                sprite: {
                    texture: 'pixelpool.png',
                    xScale: poolSpriteScale,
                    yScale: poolSpriteScale
                },
                visible: true
            }
        });

        // Daireyi dikeyde basık elips yaparak tam havuzun su yüzeyine oturtuyoruz
        Matter.Body.scale(pool, 1.0, poolHitboxRadiusY / poolHitboxRadiusX);

        // Scale işlemi sprite'ı bozmasın diye görsel oranlarını sabitliyoruz:
        pool.render.sprite.xScale = poolSpriteScale;
        pool.render.sprite.yScale = poolSpriteScale;

        // İstendiğinde havuzun yerini tekrar rastgele değiştirmek için global fonksiyon
        window.randomizePoolPosition = function () {
            const newX = Math.random() * (width - poolMargin * 2) + poolMargin;
            Matter.Body.setPosition(pool, { x: newX, y: height - 35 });
            console.log("Havuz yeni rastgele konuma taşındı: X =", newX);
        };
        // --- 4. KARAKTER SPAWN FONKSİYONU ---
        const charImagesMap = {};
        const charConfigs = [
            // Sadece yeni eklenen karakterler (Test için)
            // Kalp (characterhurt): İstenen orta boyuta getirildi ve biraz aşağı (yOffset: 2) alındı
            { file: 'characterhurt.png', scale: 0.013, radius: 9, yOffset: 2, nameYOffset: 20 }, 
            // Köpek (characterdog): 1.2x büyütüldü ve biraz aşağı alındı
            { file: 'characterdog.png', scale: 0.036, radius: 24, yOffset: 3 },
            // Diğer Karakterler
            { file: 'chracteralien.png', scale: 0.020, radius: 16, yOffset: 0 }, 
            { file: 'chractercat.png', scale: 0.030, radius: 20, yOffset: -2 }, 
            { file: 'chracterchef.png', scale: 0.100, radius: 30, yOffset: 2 },
            // Yeni Eklenen Karakterler
            { file: 'characterfrog.png', scale: 0.053, radius: 36, yOffset: 0 }, // 1.5x büyütüldü
            { file: 'charactercat3.png', scale: 0.110, radius: 28, yOffset: 0 }, // Ortada bir boyuta getirildi
            { file: 'charactercat2.png', scale: 0.200, radius: 44, yOffset: 0 }, // Daha da büyütüldü
            { file: 'characterdog2.png', scale: 0.200, radius: 44, yOffset: 0 },
            { file: 'charactersticth.png', scale: 0.180, radius: 40, yOffset: 0 } // Çok az küçültüldü
        ];
        // Manuel çizim için resimleri önceden yüklüyoruz
        charConfigs.forEach(cfg => {
            let img = new Image();
            img.src = cfg.file;
            charImagesMap[cfg.file] = img;
        });

        Composite.add(world, [leftWall, rightWall, ground, pool]);

        // --- 4. KARAKTER SPAWN FONKSİYONU ---
        function spawnCharacter(username, customEmoteUrl = null, spawnX = null, spawnY = -50, isDive = false, isDrunk = false, isTarzan = false) {
            // Eğer ekran kapalıysa aç ve yeni tema belirle
            if (!isOverlayVisible) {
                isOverlayVisible = true;
                pool.render.visible = true; // Havuzu görünür yap
                applyRandomTheme();
                document.body.style.transition = 'none'; // Tak diye ekrana çıksın
                document.body.style.opacity = '1';
                console.log("Yeni oyun başladı, overlay açılıyor!");
            }
            // Her yeni kişi düştüğünde boşta kalma süresini sıfırla (60dk zamanlayıcısı)
            resetIdleTimer();

            let actualSpawnY = spawnY;
            // Rastgele X pozisyonu (kenarlara çok yakın olmasın)
            let randomX = spawnX !== null ? spawnX : (Math.random() * (width - 100) + 50);
            
            let tarzanAnchorX = 0;
            let tarzanAnchorY = -50;
            let tarzanFromLeft = true;
            
            if (isTarzan) {
                // SARKAÇ MATEMATİĞİ:
                // Anchor ekranın tam tepesinde, ortada (görünmez nokta)
                // Karakter ekranın kenarında, orta yükseklikte başlar
                // Yerçekimi + kısıtlama = karakteri ekranın ortasına doğru fırlatır
                tarzanFromLeft = Math.random() < 0.5;
                
                // Anchor: ekranın yatay ortası, 700px yukarıda (ekran dışı)
                tarzanAnchorX = width / 2;
                tarzanAnchorY = -700;
                
                // Karakter: ekranın tam kenarında (5px içeride), dikey ortada
                // Bu sayede anchor→karakter mesafesi ipin uzunluğunu belirliyor
                // ve karakter anchor'ın tam altına (ekran ortasına) doğru sallanıyor
                randomX = tarzanFromLeft ? 5 : width - 5;
                actualSpawnY = height / 2; // Ekranın dikey ortası (yaklaşık 540px)
            }

            let randomChar;
            let customDomElement = null;

            if (customEmoteUrl) {
                // Emote boyutları 1.5x büyütüldü (radius: 24 -> 36, width/height: 48 -> 72)
                randomChar = { file: customEmoteUrl, scale: 1, radius: 36, yOffset: 0, nameYOffset: 5, isCustom: true };
                
                // Animasyonlu emote (GIF/WEBP) desteği için DOM (img) elemanı oluşturuyoruz
                customDomElement = document.createElement('img');
                customDomElement.src = customEmoteUrl;
                customDomElement.className = 'custom-emote';
                customDomElement.style.position = 'absolute';
                customDomElement.style.width = '72px';
                customDomElement.style.height = '72px';
                customDomElement.style.objectFit = 'contain';
                customDomElement.style.left = '-1000px'; 
                customDomElement.style.top = '-1000px';
                customDomElement.style.transform = 'translate(-50%, -50%)'; // Merkezlemek için
                customDomElement.style.pointerEvents = 'none';
                customDomElement.style.zIndex = '20'; // Canvas'ın üstünde olması için
                document.body.appendChild(customDomElement);

            } else {
                randomChar = charConfigs[Math.floor(Math.random() * charConfigs.length)];
            }

            // Karakter objesini oluştururken görselin (resmin) boyutuna uygun bir fiziksel çap (radius) veriyoruz ki yere batmasın.
            const character = Bodies.circle(randomX, actualSpawnY, randomChar.radius, {
                restitution: 0.9, // Sağa sola çarpınca daha çok seksin
                frictionAir: 0, // Yatay hızını havada kaybetmemesi için
                friction: 0, // Duvarlara sürttüğünde yavaşlamaması için
                inertia: Infinity, // Çarpışmalarda fırıldak gibi dönmesini engeller
                label: 'karakter',
                render: {
                    fillStyle: 'transparent', // Matter.js'in kendi yuvarlağını çizmesini engelliyoruz (biz resmi manually çizeceğiz)
                    strokeStyle: 'transparent',
                    lineWidth: 0
                },
                // Özel verilerimizi saklayacağımız obje
                plugin: {
                    username: username,
                    parachuteOpened: false, // Paraşüt henüz açılmadı
                    charTexture: customEmoteUrl ? null : randomChar.file,
                    charScale: randomChar.scale,
                    charYOffset: randomChar.yOffset || 0,
                    nameYOffset: randomChar.nameYOffset || 0,
                    isCustom: randomChar.isCustom || false,
                    domElement: customDomElement,
                    isDive: isDive,
                    isDrunk: isDrunk,
                    isTarzan: isTarzan
                }
            });

            Composite.add(world, character);

            if (isTarzan) {
                // Karaktere başlangıç ivmesi ver: sarkaç daha hızlı başlasın
                // Sol kenardan geliyorsa sağa, sağ kenardan geliyorsa sola itilsin
                const tarzanInitialVx = tarzanFromLeft ? 8 : -8;
                Body.setVelocity(character, { x: tarzanInitialVx, y: 2 });
                
                // Tek parça, düz ve sert bir ip constraint'i
                const tarzanConstraint = Constraint.create({
                    pointA: { x: tarzanAnchorX, y: tarzanAnchorY },
                    bodyB: character,
                    stiffness: 1,
                    damping: 0,
                    render: { 
                        visible: true, 
                        lineWidth: 3, 
                        strokeStyle: '#8B4513' 
                    }
                });
                
                Composite.add(world, tarzanConstraint);
                
                character.plugin.tarzanConstraint = tarzanConstraint;
                character.plugin.tarzanAnchorX = tarzanAnchorX;
                character.plugin.tarzanAnchorY = tarzanAnchorY;
                character.plugin.tarzanFromLeft = tarzanFromLeft;
                character.plugin.tarzanReleased = false;
                character.plugin.tarzanReleaseTimer = engine.timing.timestamp + 2500;
            } else {
                // Başlangıçta sağa veya sola rastgele yatay bir kuvvet uygula (dümdüz düşmemesi için)
                const randomForceX = (Math.random() - 0.5) * 0.08 * character.mass; 
                Body.applyForce(character, { x: character.position.x, y: character.position.y }, { x: randomForceX, y: 0 });
            }
        }

        // --- 5. FİZİK GÜNCELLEMESİ (PARAŞÜT MEKANİĞİ) ---
        Events.on(engine, 'beforeUpdate', function () {
            const bodies = Composite.allBodies(world);

            // Dünyadaki tüm objeleri kontrol et
            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];

                // Sadece bizim oluşturduğumuz 'karakter' etiketli objeler için işlem yap
                if (body.label === 'karakter' && body.plugin) {
                    
                    // --- DIVE MODU İÇİN ÖZEL DAVRANIŞ (PARAŞÜT İPTALİ VE HAVADA SPIN) ---
                    if (body.plugin.isDive) {
                        if (!body.plugin.landed) {
                            Matter.Body.setAngularVelocity(body, 0); // Dönme efektini tamamen kapattık
                            Matter.Body.setAngle(body, 0); // Havadayken dümdüz (dik) durması için açıyı kilitledik
                            Matter.Body.setVelocity(body, { x: 0, y: body.velocity.y }); // Sağa sola sapmayı (savrulmayı) tamamen engelle, dümdüz insin
                        }
                        continue; // Paraşüt açılma sınırlarını ve sarkaçları tamamen pas geç
                    }

                    // --- TARZAN MODU İÇİN ÖZEL DAVRANIŞ ---
                    if (body.plugin.isTarzan) {
                        if (!body.plugin.landed) {
                            Matter.Body.setAngularVelocity(body, 0);
                            Matter.Body.setAngle(body, 0);
                            
                            // Timer dolduysa ve henüz ip kopmadıysa kopar
                            if (!body.plugin.tarzanReleased && engine.timing.timestamp > body.plugin.tarzanReleaseTimer) {
                                body.plugin.tarzanReleased = true;
                                if (body.plugin.tarzanConstraint) {
                                    Composite.remove(world, body.plugin.tarzanConstraint);
                                }
                                
                                // Kopma anında fiziksel ip parçalarını oluşturup karakterin peşinden düşmesini sağla
                                const dx = body.plugin.tarzanAnchorX - body.position.x;
                                const dy = body.plugin.tarzanAnchorY - body.position.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                const segments = 8;
                                const segmentLength = distance / segments;
                                const angle = Math.atan2(dy, dx);
                                
                                const ropeBodies = [];
                                const group = Matter.Body.nextGroup(true);
                                
                                for (let j = 0; j < segments; j++) {
                                    const cx = body.position.x + Math.cos(angle) * (j + 0.5) * segmentLength;
                                    const cy = body.position.y + Math.sin(angle) * (j + 0.5) * segmentLength;
                                    const segment = Matter.Bodies.rectangle(cx, cy, 5, segmentLength, {
                                        collisionFilter: { group: group },
                                        render: { fillStyle: '#8B4513' },
                                        density: 0.002, // Hafif olsun
                                        angle: angle - Math.PI / 2
                                    });
                                    Matter.Body.setVelocity(segment, { x: body.velocity.x, y: body.velocity.y });
                                    ropeBodies.push(segment);
                                }
                                
                                const rope = Matter.Composite.create({ bodies: ropeBodies });
                                for (let j = 0; j < segments - 1; j++) {
                                    Matter.Composite.add(rope, Matter.Constraint.create({
                                        bodyA: ropeBodies[j],
                                        pointA: { x: 0, y: segmentLength / 2 },
                                        bodyB: ropeBodies[j + 1],
                                        pointB: { x: 0, y: -segmentLength / 2 },
                                        stiffness: 0.9,
                                        render: { visible: false }
                                    }));
                                }
                                
                                Matter.Composite.add(rope, Matter.Constraint.create({
                                    bodyA: ropeBodies[0],
                                    pointA: { x: 0, y: -segmentLength / 2 },
                                    bodyB: body,
                                    stiffness: 0.9,
                                    render: { visible: false }
                                }));
                                
                                Matter.Composite.add(world, rope);
                                body.plugin.tarzanRope = rope;
                                
                                body.plugin.tarzanDeleteTimer = engine.timing.timestamp + 3000;
                            }
                        }
                        
                        if (body.plugin.tarzanReleased && body.plugin.tarzanRope && engine.timing.timestamp > body.plugin.tarzanDeleteTimer) {
                            Composite.remove(world, body.plugin.tarzanRope);
                            body.plugin.tarzanRope = null;
                        }
                        
                        continue;
                    }

                    if (body.plugin.landed) {
                        // Topun görünürlüğünü yavaş yavaş %75'e düşür (tak diye inmesin)
                        if (body.plugin.ballOpacity === undefined) body.plugin.ballOpacity = 1;
                        if (body.plugin.ballOpacity > 0.75) {
                            body.plugin.ballOpacity -= 0.01;
                            if (body.plugin.ballOpacity < 0.75) body.plugin.ballOpacity = 0.75;
                        }

                        // Yere indikten sonra paraşütü aşağı kaydırarak ve şeffaflaştırarak (fade) yok et
                        // Eğer paraşüt objesi aktifse yok olma animasyonunu yap
                        if (body.render.sprite && body.render.sprite.texture) {
                            body.render.sprite.yOffset -= 0.03;

                            // Opacity (şeffaflık) azalt
                            if (body.render.opacity === undefined) body.render.opacity = 1;
                            body.render.opacity -= 0.05; // Hızlıca kaybolması için

                            if (body.render.sprite.yOffset < -1.0 || body.render.opacity <= 0) {
                                body.plugin.parachuteOpened = false; // Paraşüt tamamen kapandı
                                // Paraşüt silinince sadece resmi biz çizmeye devam edeceğiz
                                delete body.render.sprite.texture;
                                body.render.sprite.yOffset = 0;
                                body.render.opacity = body.plugin.ballOpacity;
                            }
                        } else {
                            // Paraşüt zaten silinmişse opacity'yi güncelliyoruz
                            body.render.opacity = body.plugin.ballOpacity;
                        }
                    } else if (!body.plugin.parachuteOpened) {
                        if (body.plugin.isDrunk) {
                            if (!body.plugin.drunkTimerFreefall || engine.timing.timestamp > body.plugin.drunkTimerFreefall) {
                                body.plugin.drunkTimerFreefall = engine.timing.timestamp + 800 + Math.random() * 800;
                                const randomSpeedX = (Math.random() - 0.5) * 40;
                                Matter.Body.setVelocity(body, { x: randomSpeedX, y: body.velocity.y });
                            }
                            
                            if (!body.plugin.drunkJerkTimerFreefall || engine.timing.timestamp > body.plugin.drunkJerkTimerFreefall) {
                                body.plugin.drunkJerkTimerFreefall = engine.timing.timestamp + 200 + Math.random() * 300;
                                const jerkX = (Math.random() - 0.5) * 20;
                                Matter.Body.setVelocity(body, { x: body.velocity.x * 0.7 + jerkX, y: body.velocity.y });
                            }
                            
                            // Dalgalı hareket kuvveti (titrek düşüş)
                            let time = engine.timing.timestamp * 0.0015;
                            let wavyForceX = Math.sin(time * 10 + body.id) * 0.0003 * body.mass;
                            Matter.Body.applyForce(body, body.position, { x: wavyForceX, y: 0 });
                            
                            // Daha az sürtünme ile uzun savrulmalar
                            Matter.Body.setVelocity(body, { x: body.velocity.x * 0.995, y: body.velocity.y });
                        }
                        // Çarpışma sonrası bekleme (cooldown) süresini kontrol et
                        let canOpen = true;
                        if (body.plugin.parachuteCooldown && engine.timing.timestamp < body.plugin.parachuteCooldown) {
                            canOpen = false;
                        }

                        // Obje ekranın üst 1/4'ünü geçti mi ve açılmaya hazır mı?
                        if (canOpen && body.position.y > height / 4) {
                            body.plugin.parachuteOpened = true;
                            body.plugin.parachuteOpening = true; // Açılış animasyonunu başlat

                            // Kullanıcının panelden seçtiği aktif paraşütler arasından rastgele birini seç
                            const listToUse = activeParachutes.length > 0 ? activeParachutes : [11];
                            const parasutNo = listToUse[Math.floor(Math.random() * listToUse.length)];
                            
                            body.render.sprite.texture = `parasut${parasutNo}.png`;
                            body.render.sprite.yOffset = 0.8; // Paraşütü karakterin üstüne taşır

                            // 15-18 arası paraşütler ~1300px olduğu için hedef boyutunu orantılıyoruz (~200px olmaları için)
                            const targetScale = parasutNo >= 15 ? 0.15 : 1.0;
                            body.plugin.targetParachuteScale = targetScale;

                            body.render.sprite.xScale = 0.02; // Animasyon için küçük başla
                            body.render.sprite.yScale = 0.02;
                            body.render.opacity = 0; // Transparan başla
                        }
                    } else {
                        // PARAŞÜT AÇIK DURUMU: (Açılıyor, Kapanıyor veya Tam Açık)

                        // 1. Paraşüt Salınım (Sarkaç) Hareketi: Açılırken/kapanırken de doğal salınsın
                        // Salınım hızını azaltmak için zaman çarpanı 0.003'ten 0.0015'e düşürüldü
                        let time = engine.timing.timestamp * 0.0015;
                        let swayAngle = Math.sin(time + body.id) * 0.15;
                        let swayForce = Math.sin(time + body.id) * 0.00002 * body.mass;
                        
                        if (body.plugin.isDrunk) {
                            // Salınımı daha yavaş ve sakin yapıyoruz
                            swayAngle = Math.sin(time * 0.8 + body.id) * 0.2;
                            // Dalgalı (wavy) hareket için sürekli sarsıntılı bir kuvvet
                            swayForce = Math.sin(time * 12 + body.id) * 0.00015 * body.mass;
                            
                            if (!body.plugin.drunkTimer || engine.timing.timestamp > body.plugin.drunkTimer) {
                                // 1.2s - 2.5s arası ana yön belirle (daha uzun süre bir yöne gitsin)
                                body.plugin.drunkTimer = engine.timing.timestamp + 1200 + Math.random() * 1300;
                                
                                // Çok daha abartılı sağ-sol savrulması (-25 ile +25 arası hızlar)
                                const randomSpeedX = (Math.random() - 0.5) * (Math.random() * 40 + 10);
                                
                                // Dikey hızda ani yavaşlamalar veya hafif hızlı düşüşler (0 - 2.5)
                                const randomSpeedY = Math.random() * 2.5;
                                
                                Matter.Body.setVelocity(body, { x: randomSpeedX, y: randomSpeedY });
                            }
                            
                            if (!body.plugin.drunkJerkTimer || engine.timing.timestamp > body.plugin.drunkJerkTimer) {
                                // 0.2s - 0.5s arası küçük zikzak (sağa giderken küçük sol yapıp sağa devam etme vb)
                                body.plugin.drunkJerkTimer = engine.timing.timestamp + 200 + Math.random() * 300;
                                
                                // Ana hızı biraz koruyarak üzerine zıt veya aynı yönde ufak sapmalar ekle
                                const jerkX = (Math.random() - 0.5) * 15;
                                Matter.Body.setVelocity(body, { x: body.velocity.x * 0.75 + jerkX, y: body.velocity.y });
                            }
                            
                            // Sürtünmeyi azalttım, momentumunu daha uzun süre korusun (0.99 -> 0.995)
                            Matter.Body.setVelocity(body, { x: body.velocity.x * 0.995, y: body.velocity.y });
                        }
                        
                        Matter.Body.setAngle(body, swayAngle);
                        Matter.Body.applyForce(body, body.position, { x: swayForce, y: 0 });

                        // 2. Duruma Özel İşlemler
                        const maxScale = body.plugin.targetParachuteScale || 1.0;
                        if (body.plugin.parachuteClosing) {
                            // Çarpışma Sonrası Kapanma Animasyonu (Hızlandırıldı)
                            if (body.render.sprite && body.render.sprite.texture) {
                                body.render.sprite.xScale -= (0.15 * maxScale);
                                body.render.sprite.yScale -= (0.15 * maxScale);
                                body.render.opacity -= 0.2;

                                if (body.render.sprite.xScale <= (0.1 * maxScale) || body.render.opacity <= 0) {
                                    body.plugin.parachuteClosing = false;
                                    body.plugin.parachuteOpened = false;
                                    delete body.render.sprite.texture;
                                    body.render.sprite.yOffset = 0;
                                    body.render.opacity = 1;
                                    body.plugin.parachuteCooldown = engine.timing.timestamp + 300;
                                }
                            }
                        } else if (body.plugin.parachuteOpening) {
                            // İlk Açılma Animasyonu (Hızlandırıldı - Daha anında patlar)
                            if (body.render.sprite && body.render.sprite.texture) {
                                body.render.sprite.xScale += (0.3 * maxScale);
                                body.render.sprite.yScale += (0.3 * maxScale);
                                body.render.opacity += 0.3;

                                if (body.velocity.y > 1.5) Matter.Body.setVelocity(body, { x: body.velocity.x, y: 1.5 });

                                if (body.render.sprite.xScale >= maxScale) {
                                    body.render.sprite.xScale = maxScale;
                                    body.render.sprite.yScale = maxScale;
                                    body.render.opacity = 1;
                                    body.plugin.parachuteOpening = false;
                                }
                            }
                        } else {
                            // NORMAL AÇIK DURUM
                            // Sarhoş ise dikey hız sınırı biraz daha esnek olsun (1.5 yerine 2.5'a kadar izin ver)
                            const maxSpeedY = body.plugin.isDrunk ? 2.5 : 1.5;
                            if (body.velocity.y > maxSpeedY) {
                                Matter.Body.setVelocity(body, { x: body.velocity.x, y: maxSpeedY });
                            }
                        } // closes inner else
                    } // closes outer else
                } // closes if(body.label === 'karakter')
            } // closes for loop
        });

        // --- 6. ÇARPIŞMA (PUANLAMA VE SİLME) ---
        let currentKing = null; // Havuzdaki mevcut lider
        // Kral silinme zamanlayıcısı kaldırıldı (overlay açık olduğu sürece silinmeyecek)

        Events.on(engine, 'collisionStart', function (event) {
            const pairs = event.pairs;

            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                let characterBody = null;
                let groundBody = null;

                // Hangi objenin havuz/zemin, hangisinin karakter olduğunu tespit et
                let isTarget = (bodyA.label === 'hedefZemin' || bodyA.label === 'zemin') && bodyB.label === 'karakter';
                let isTargetReverse = (bodyB.label === 'hedefZemin' || bodyB.label === 'zemin') && bodyA.label === 'karakter';

                if (isTarget) {
                    groundBody = bodyA;
                    characterBody = bodyB;
                } else if (isTargetReverse) {
                    groundBody = bodyB;
                    characterBody = bodyA;
                }

                // --- İKİ KARAKTER HAVADA ÇARPIŞIRSA ---
                if (bodyA.label === 'karakter' && bodyB.label === 'karakter') {
                    if (!bodyA.plugin.landed && !bodyB.plugin.landed) {
                        // Sadece paraşütü açık olanları (veya açılmakta olanları) kapatma animasyonuna sok
                        if (bodyA.plugin.parachuteOpened) bodyA.plugin.parachuteClosing = true;
                        if (bodyB.plugin.parachuteOpened) bodyB.plugin.parachuteClosing = true;

                        // Çarpışan karakterlerin daha az zıplaması için hız düşürüldü
                        Matter.Body.setVelocity(bodyA, { x: bodyA.velocity.x, y: -3 });
                        Matter.Body.setVelocity(bodyB, { x: bodyB.velocity.x, y: -3 });
                    }
                }

                // Havuz veya zemin ile bir karakter çarpıştıysa ve daha önce kilitlenmediyse:
                if (characterBody && groundBody && !characterBody.plugin.landed) {
                    characterBody.plugin.landed = true;
                    // Paraşütü anında silmiyoruz; beforeUpdate içinde yavaşça aşağı kaydırılacak.

                    // Karakteri çarptığı yere anında kilitle (zıplama veya kayma olmasın)
                    Matter.Body.setStatic(characterBody, true);
                    Matter.Body.setAngle(characterBody, 0); // Yere düştüğünde dümdüz dik dursun

                    // Yere düşen karakteri 'hayalet' (sensor) yap ki yeni düşenler ona çarpıp sekmesin, içinden geçsin
                    characterBody.isSensor = true;

                    // Puan hesaplama (sadece havuza düştüyse puan ver, zemine düştüyse puan yok)
                    let finalScore = null; // Havuzu tutturamayanlar veya lideri geçemeyenler için null
                    let waitTime = 3000; // Dışarı düşenler 3sn bekler

                    if (groundBody.label === 'hedefZemin') {
                        const centerX = groundBody.position.x; // Havuzun anlık X konumu (rastgele spawn olduğu yer)
                        const charX = characterBody.position.x;
                        const distance = Math.abs(centerX - charX);
                        const maxDistance = poolHitboxRadiusX; // 315'ten 155'e düşürüldü (görsel havuz yarıçapı ile birebir eşitlendi)

                        let rawScore = 100 * (1 - (distance / maxDistance));
                        let clampedScore = Math.max(1, Math.min(100, rawScore));
                        let calculatedScore = parseFloat(clampedScore.toFixed(2));

                        // Havuza düşen herkesin skorunu sağdaki "Atla Sıralaması" tablosuna ekle/güncelle
                        updateLeaderboard(characterBody.plugin.username, calculatedScore);

                        // Kral Mekaniği (Mevcut kralın puanını al, yoksa -1 say)
                        let currentKingScore = (currentKing && currentKing.plugin && currentKing.plugin.score) ? parseFloat(currentKing.plugin.score) : -1;

                        if (calculatedScore > currentKingScore) {
                            // YENİ KRAL! (Veya havuz boş)
                            finalScore = clampedScore.toFixed(2);
                            waitTime = 30000; // Kral 30 saniye bekleyecek

                            // Eğer içeride eski bir kral varsa süresini beklemeden hemen sil
                            if (currentKing) {
                                if (currentKing.plugin.removeTimer) clearTimeout(currentKing.plugin.removeTimer);
                                Composite.remove(world, currentKing);
                            }

                            currentKing = characterBody; // Yeni kral artık bu kişi
                            
                            // Kralın süresi: 30 saniye sonra gidecek
                            characterBody.plugin.removeTimer = setTimeout(() => {
                                Composite.remove(world, characterBody);
                                if (currentKing === characterBody) {
                                    currentKing = null;
                                }
                            }, waitTime);

                        } else {
                            // KRALI GEÇEMEDİ! Havuzun içine düştü ama lider olamadı. 
                            // Havuza düşenlerin süresi 6 saniye.
                            finalScore = null;
                            waitTime = 6000;

                            setTimeout(() => {
                                Composite.remove(world, characterBody);
                            }, waitTime);
                        }
                    } else {
                        // ZEMİNE (HAVUZ DIŞINA) DÜŞENLER
                        setTimeout(() => {
                            Composite.remove(world, characterBody);
                        }, waitTime);
                    }

                    // Puanı eklentinin (plugin) içerisine kaydedelim
                    characterBody.plugin.score = finalScore;

                    if (finalScore !== null) {
                        console.log(`[${characterBody.plugin.username}] YENİ LİDER! PUAN: ${finalScore} - Havuzda Kalma Süresi: ${waitTime / 1000}sn`);
                    } else {
                        console.log(`[${characterBody.plugin.username}] havuza düştü ama Lideri geçemedi (veya dışarı düştü). 3sn sonra silinecek.`);
                    }
                }
            }
        });

        // --- 7. KULLANICI İSİMLERİ VE PUANLARI ÇİZİMİ ---
        Events.on(render, 'afterRender', function () {
            const context = render.context;
            const bodies = Composite.allBodies(world);

            // Havuzun merkezindeki su yüzeyine belirgin transparan "CrossWeq" yazısı
            if (typeof pool !== 'undefined' && pool) {
                context.save();
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                // Daha belirgin ve okunaklı yarı saydam filigran
                context.font = '700 22px "Outfit", sans-serif';
                context.lineWidth = 2;

                const watermarkX = pool.position.x;
                const watermarkY = pool.position.y - 14;

                context.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                context.strokeText("CrossWeq", watermarkX, watermarkY);

                context.fillStyle = 'rgba(0, 0, 0, 0.6)';
                context.fillText("CrossWeq", watermarkX, watermarkY);

                context.restore();
            }

            context.textAlign = 'center';

            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];
                if (body.label === 'karakter' && body.plugin && body.plugin.username) {
                    // Karakterleri her zaman manuel olarak çiziyoruz, böylece paraşüt açıldığında veya yere değdiğinde asla yok olmuyorlar.
                    context.save();
                    // Karakterin kendi şeffaflığını (ballOpacity) kullan (Paraşütün silinme animasyonu karaktere yansımasın)
                    const opacity = body.plugin.ballOpacity !== undefined ? body.plugin.ballOpacity : 1;
                    context.globalAlpha = opacity;

                    if (body.plugin.isCustom && body.plugin.domElement) {
                        // DOM elementini güncelle (Animasyonlu GIF/WEBP desteği)
                        const el = body.plugin.domElement;
                        el.style.left = body.position.x + 'px';
                        el.style.top = (body.position.y + (body.plugin.charYOffset || 0)) + 'px';
                        el.style.transform = `translate(-50%, -50%) rotate(${body.angle}rad)`;
                        el.style.opacity = opacity;
                    } else if (body.plugin.charTexture) {
                        let img = charImagesMap[body.plugin.charTexture];
                        if (img && img.complete) {
                            let drawWidth = img.width * body.plugin.charScale;
                            let drawHeight = img.height * body.plugin.charScale;
                            context.translate(body.position.x, body.position.y + (body.plugin.charYOffset || 0));
                            context.rotate(body.angle);
                            context.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                        }
                    }
                    context.restore();

                    // Lider (Kral) kontrolü
                    const isLeader = (body === currentKing);

                    // Kullanıcı Adını Yazdır
                    const fontSize = isLeader ? 23 : 18; // Boyutlar 1.2x büyütüldü
                    // Karakter boyutları farklı olduğu için ismin yüksekliğini görselin tepesine (visual radius) göre dinamik belirliyoruz
                    const visualRadius = (body.circleRadius || 30) - (body.plugin.charYOffset || 0);
                    const nameOffsetY = (isLeader ? (visualRadius + 28) : (visualRadius + 18)) + (body.plugin.nameYOffset || 0); // Özel karakter offset'i varsa ekle
                    
                    context.font = `600 ${fontSize}px "Outfit", sans-serif`;
                    context.textAlign = "center"; // Puan ile karakter isminin hizada (ortalı) durması için
                    context.fillStyle = 'white';
                    context.shadowColor = 'rgba(0, 0, 0, 0.6)';
                    context.shadowBlur = 3;
                    context.lineWidth = 2; // 3px'ten 2px'e düşürülerek kabalığı alındı

                    // Etrafına ince siyah kontur çiz
                    context.strokeText(body.plugin.username, body.position.x, body.position.y - nameOffsetY);
                    // İçini beyaz doldur
                    context.fillText(body.plugin.username, body.position.x, body.position.y - nameOffsetY);

                    // Eğer yere düşmüş ve puanı belli olmuşsa (null değilse) puanını da yazdır
                    if (body.plugin.score !== undefined && body.plugin.score !== null) {
                        context.font = '700 23px "Outfit", sans-serif'; // Daha zarif ve modern
                        context.lineWidth = 2;

                        const numScore = parseFloat(body.plugin.score);
                        // Renk Kuralları:
                        // 90 altı: Yeşil
                        // 90 - 95: Sarı
                        // 95 - 100: Kırmızı
                        if (numScore < 90) {
                            context.fillStyle = '#22c55e'; // Canlı Yeşil
                        } else if (numScore <= 95) {
                            context.fillStyle = '#facc15'; // Altın Sarısı
                        } else {
                            context.fillStyle = '#ef4444'; // Ateş Kırmızısı
                        }

                        let scoreText = body.plugin.score;
                        // Sadece 95 puan ve üzerine yıldız ekle
                        if (numScore >= 95) {
                            scoreText = `${scoreText} ⭐`;
                        }

                        // Puan boyutu 27px olduğu için ismin üzerine taşmasın diye aralığı 40'a çıkararak yukarı taşıdık
                        const scoreOffsetY = nameOffsetY + 40;

                        context.strokeText(scoreText, body.position.x, body.position.y - scoreOffsetY);
                        context.fillText(scoreText, body.position.x, body.position.y - scoreOffsetY);
                    }

                    // Gölgeleri kapat (diğer çizimleri etkilememesi için)
                    context.shadowBlur = 0;
                }
            }
        });

        // --- 7.5 OVERLAY GİZLEME KONTROLÜ (BOŞTA KALMA DURUMU) ---
        // Saniyede bir kez ekranda hiç karakter kaldı mı kontrol et
        let overlayIdleTimerRef = null;
        setInterval(() => {
            if (typeof Composite !== 'undefined' && typeof world !== 'undefined') {
                // Sahnede herhangi bir karakter (kral dahil) var mı kontrol et
                const activeCharBodies = Composite.allBodies(world).filter(b => b.label === 'karakter');
                const activeChars = activeCharBodies.length;
                
                // Silinmiş karakterlerin DOM elementlerini temizle (Memory leak önleme)
                const activeDomElements = activeCharBodies.map(b => b.plugin.domElement).filter(e => e);
                document.querySelectorAll('.custom-emote').forEach(el => {
                    if (!activeDomElements.includes(el)) {
                        el.remove();
                    }
                });

                // Eğer sahnede HİÇ karakter kalmadıysa ve overlay açıksa 5 saniyelik zamanlayıcıyı başlat
                if (activeChars === 0 && isOverlayVisible) {
                    if (!overlayIdleTimerRef) {
                        overlayIdleTimerRef = setTimeout(() => {
                            isOverlayVisible = false;
                            document.body.style.transition = 'opacity 1.5s ease-in-out'; // Kaybolurken yumuşak kaybolsun
                            document.body.style.opacity = '0';
                            console.log("Sahne tamamen boşaldı, 5 saniye geçti, overlay gizleniyor.");
                            
                            if (currentKing) {
                                if (currentKing.plugin.removeTimer) clearTimeout(currentKing.plugin.removeTimer);
                                Composite.remove(world, currentKing);
                                currentKing = null;
                            }

                            // 1.5 saniye sonra arkaplanı ve havuzu tamamen yok et
                            setTimeout(() => {
                                if (!isOverlayVisible) {
                                    document.body.style.backgroundImage = 'none';
                                    pool.render.visible = false;
                                }
                            }, 1500);
                        }, 5000); // 5 saniye bekle
                    }
                } else if (activeChars > 0 && overlayIdleTimerRef) {
                    // Ekranda karakter varsa (biri yeni atladıysa) gizleme işlemini iptal et
                    clearTimeout(overlayIdleTimerRef);
                    overlayIdleTimerRef = null;
                }
            }
        }, 1000);

        // --- 8. KICK WEBSOCKET (GERÇEK ZAMANLI BAĞLANTI) ---
        async function setupKickChatListener() {
            if (!channelName || channelName === 'testkanal') {
                console.log("Test kanalı kullanılıyor.");
                return;
            }

            console.log(`Kick chat bağlantısı kuruluyor... Kanal: ${channelName}`);

            // Chatroom ID'yi otomatik bulmak için sırayla deniyoruz
            const apiTargets = [
                `https://kick.com/api/v2/channels/${channelName}/chatroom`,
                `https://corsproxy.io/?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + channelName + '/chatroom')}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + channelName + '/chatroom')}`,
                `https://api.codetabs.com/v1/proxy?quest=https://kick.com/api/v2/channels/${channelName}/chatroom`
            ];

            let chatroomId = null;
            for (const url of apiTargets) {
                try {
                    console.log('Deneniyor:', url);
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 7000);
                    const res = await fetch(url, { signal: ctrl.signal });
                    clearTimeout(tid);
                    const raw = await res.json();
                    // allorigins wrapper
                    const data = raw.contents ? JSON.parse(raw.contents) : raw;
                    if (data && data.id) {
                        chatroomId = data.id;
                        console.log('Chatroom ID bulundu:', chatroomId);
                        break;
                    }
                } catch(e) {
                    console.warn('Bu kaynak başarısız, diğerine geçiliyor...');
                }
            }

            if (!chatroomId) {
                console.error('Chatroom ID bulunamadı. Tüm kaynaklar engellendi.');
                return;
            }

            try {
                const pusher = new Pusher('32cbd69e4b950bf97679', {
                    cluster: 'us2',
                    forceTLS: true
                });

                const kickChannel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
                console.log('Kick sohbetine başarıyla bağlanıldı ve dinleniyor...');

                // Tüm eventleri logla (debug amaçlı)
                kickChannel.bind_global((eventName, rawData) => {
                    if (eventName.startsWith('pusher:')) return; // Pusher sistem eventlerini gizle
                    console.log('[Pusher Event]', eventName, rawData);
                });

                kickChannel.bind('App\\Events\\ChatMessageEvent', (rawData) => {
                    try {
                        // Bazen data string olarak gelir, bazen obje — ikisini de handle ediyoruz
                        let eventData = rawData;
                        if (typeof rawData === 'string') {
                            eventData = JSON.parse(rawData);
                        }
                        if (eventData && typeof eventData.data === 'string') {
                            eventData = JSON.parse(eventData.data);
                        }

                        if (!eventData) return;

                        const message = (eventData.content || '').trim();
                        const username = eventData.sender ? eventData.sender.username : null;

                        if (!message || !username) return;
                        console.log(`[Chat] ${username}: ${message}`);

                        // Yayıncı !resetdrop yazarsa tüm bekleme süreleri sıfırlanır
                        if (message.toLowerCase() === '!resetdrop' && username.toLowerCase() === channelName.toLowerCase()) {
                            userCooldowns.clear();
                            isDropTogetherMode = false;
                            dropTogetherQueue = [];
                            console.log('[DropPool] !resetdrop komutu alındı — tüm bekleme süreleri sıfırlandı ve toplu atlama iptal edildi.');
                            return;
                        }

                        // Yayıncı !droptogether yazarsa toplu atlayış moduna geç
                        if (message.toLowerCase() === '!droptogether' && username.toLowerCase() === channelName.toLowerCase()) {
                            isDropTogetherMode = true;
                            dropTogetherQueue = [];
                            console.log('[DropPool] Toplu atlayış (Drop Together) modu AKTİF! İzleyiciler sıraya alınıyor.');
                            return;
                        }

                        const msgLower = message.toLowerCase();
                        const cmdLower = commandStr.toLowerCase();
                        
                        // Dive komutu kontrolü
                        let isDiveCommand = false;
                        let isNormalDropCommand = false;
                        let isDrunkCommand = false;
                        let isTarzanCommand = false;

                        if (msgLower === cmdLower + " dive" || msgLower === cmdLower + "dive" || msgLower.startsWith(cmdLower + " dive ") || msgLower.startsWith(cmdLower + "dive ") || msgLower.startsWith(cmdLower + " dive[") || msgLower.startsWith(cmdLower + "dive[")) {
                            isDiveCommand = true;
                        } else if (msgLower === cmdLower + " drunk" || msgLower === cmdLower + "drunk" || msgLower.startsWith(cmdLower + " drunk ") || msgLower.startsWith(cmdLower + "drunk ") || msgLower.startsWith(cmdLower + " drunk[") || msgLower.startsWith(cmdLower + "drunk[")) {
                            isDrunkCommand = true;
                        } else if (msgLower === cmdLower + " tarzan" || msgLower === cmdLower + "tarzan" || msgLower.startsWith(cmdLower + " tarzan ") || msgLower.startsWith(cmdLower + "tarzan ") || msgLower.startsWith(cmdLower + " tarzan[") || msgLower.startsWith(cmdLower + "tarzan[")) {
                            isTarzanCommand = true;
                        } else if (msgLower === cmdLower || msgLower.startsWith(cmdLower + " ") || msgLower.startsWith(cmdLower + "[")) {
                            isNormalDropCommand = true;
                        }

                        if (isDiveCommand || isDrunkCommand || isTarzanCommand || isNormalDropCommand) {
                            if (checkCooldown(username)) {
                                let customEmoteUrl = null;
                                // Kick emote yapısını tespit et: [emote:12345:EmoteName]
                                const emoteMatch = message.match(/\[emote:(\d+):.*?\]/i);
                                if (emoteMatch) {
                                    const emoteId = emoteMatch[1];
                                    customEmoteUrl = `https://files.kick.com/emotes/${emoteId}/fullsize`;
                                }
                                
                                if (isDiveCommand) {
                                    // Dalış modu (helikopter)
                                    triggerHelicopterDrop(username, customEmoteUrl);
                                } else {
                                    // Normal, drunk veya tarzan atlama modu
                                    if (isDropTogetherMode) {
                                        if (username.toLowerCase() === channelName.toLowerCase()) {
                                            // Yayıncı atlarsa uçağı tetikle ve modu kapat
                                            isDropTogetherMode = false;
                                            if (!dropTogetherQueue.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                                                dropTogetherQueue.unshift({ username, customEmoteUrl, isDrunk: isDrunkCommand, isTarzan: isTarzanCommand });
                                            }
                                            triggerPlaneDrop();
                                        } else {
                                            // İzleyici atlarsa sıraya ekle
                                            if (!dropTogetherQueue.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                                                dropTogetherQueue.push({ username, customEmoteUrl, isDrunk: isDrunkCommand, isTarzan: isTarzanCommand });
                                                console.log(`[DropPool] Sıraya eklendi: ${username}. (Sıra uzunluğu: ${dropTogetherQueue.length})`);
                                            } else {
                                                console.log(`[DropPool] ${username} zaten sırada.`);
                                            }
                                        }
                                    } else {
                                        // Normal, drunk veya tarzan modda doğrudan düşür
                                        spawnCharacter(username, customEmoteUrl, null, -50, false, isDrunkCommand, isTarzanCommand);
                                    }
                                }
                            }
                        }
                    } catch(e) {
                        console.error('Mesaj işlenirken hata:', e);
                    }
                });

            } catch (error) {
                console.error('Kick bağlantısı sırasında hata:', error);
            }
        }

        // --- HELİKOPTER (DIVE) ANİMASYONU ---
        function triggerHelicopterDrop(username, customEmoteUrl, forcedHeliNo = null) {
            // Eğer ekran kapalıysa arka planı uyandır
            if (!isOverlayVisible) {
                isOverlayVisible = true;
                pool.render.visible = true;
                applyRandomTheme();
                document.body.style.transition = 'none';
                document.body.style.opacity = '1';
            }
            resetIdleTimer();

            // forcedHeliNo varsa onu kullan, yoksa 1-9 arası rastgele helikopter seç
            const heliNo = forcedHeliNo !== null ? forcedHeliNo : Math.floor(Math.random() * 9) + 1;
            
            const heli = document.createElement('img');
            heli.src = `Helicopter${heliNo}.png`;
            heli.style.position = 'absolute';
            heli.style.top = '20px'; // Biraz daha yukarı alındı (50px -> 20px)
            heli.style.left = '-500px'; 
            heli.style.width = '450px'; // İlk haline (300) göre 1.5x büyütüldü
            heli.style.zIndex = '100';
            heli.style.transition = 'left 5s linear';
            document.body.appendChild(heli);

            setTimeout(() => {
                heli.style.left = (window.innerWidth + 500) + 'px';
            }, 50);

            const startDropX = window.innerWidth * 0.15;
            const endDropX = window.innerWidth * 0.85;
            
            const totalDistance = window.innerWidth + 1000; // -500 to w+500
            const speed = totalDistance / 5000; 

            const timeToStart = (startDropX - (-500)) / speed;
            const timeToEnd = (endDropX - (-500)) / speed;
            const safeDuration = timeToEnd - timeToStart;

            // Rastgele bir bırakma zamanı belirle (güvenli alan içinde)
            const randomDropOffset = Math.random() * safeDuration;
            const dropTime = timeToStart + randomDropOffset;
            const expectedX = -500 + (speed * dropTime);

            setTimeout(() => {
                // Helikopterin (450px) alt merkezinden düşsün (expectedX + 225). Helikopter yukarı çıktığı için Y=120 oldu.
                spawnCharacter(username, customEmoteUrl, expectedX + 225, 120, true);
            }, dropTime);

            setTimeout(() => {
                if (heli.parentNode) heli.parentNode.removeChild(heli);
            }, 5000);
        }

        // --- TOPLU ATLAYIŞ UÇAK ANİMASYONU ---
        function triggerPlaneDrop() {
            if (dropTogetherQueue.length === 0) return;
            
            isPlaneFlying = true;
            
            // Eğer ekran kapalıysa arka planı uyandır
            if (!isOverlayVisible) {
                isOverlayVisible = true;
                pool.render.visible = true;
                applyRandomTheme();
                document.body.style.transition = 'none';
                document.body.style.opacity = '1';
            }
            resetIdleTimer();

            // Uçak görselini oluştur
            const plane = document.createElement('img');
            plane.src = 'plane1.png';
            plane.style.position = 'absolute';
            plane.style.top = '50px'; 
            plane.style.left = '-550px'; // Uçak daha da büyük olduğu için daha soldan başlasın
            plane.style.width = '500px'; // 250px'in 2 katı (2x büyütüldü)
            plane.style.zIndex = '100';
            plane.style.transition = 'left 5s linear';
            // Havacılık hissi için sağa doğru ilerlerken düz durmasını sağla (Görsel yönüne göre değiştirebilirsiniz)
            document.body.appendChild(plane);

            // Frame güncellenmesi için ufacık bekleyip uçağı hareket ettiriyoruz
            setTimeout(() => {
                plane.style.left = (window.innerWidth + 550) + 'px';
            }, 50);

            // Uçak geçerken ekranın güvenli X alanında (örneğin %15 ile %85 arası) karakterleri bırakıcak
            const startDropX = window.innerWidth * 0.15;
            const endDropX = window.innerWidth * 0.85;
            
            const totalDistance = window.innerWidth + 1100; // -550'den w+550'e (5 saniyede)
            const speed = totalDistance / 5000; // px per ms

            const timeToStart = (startDropX - (-550)) / speed;
            const timeToEnd = (endDropX - (-550)) / speed;
            const safeDuration = timeToEnd - timeToStart;

            const usersToDrop = [...dropTogetherQueue];
            dropTogetherQueue = [];

            const intervalTime = safeDuration / Math.max(1, usersToDrop.length);

            // Tüm kullanıcıları uçağın o anki tahmini pozisyonunda spawn et
            usersToDrop.forEach((user, index) => {
                const dropTime = timeToStart + (intervalTime * index);
                const expectedX = -550 + (speed * dropTime);

                setTimeout(() => {
                    // Uçağın gövde alt merkezinden düşsünler
                    spawnCharacter(user.username, user.customEmoteUrl, expectedX + (500 / 2), 150, false, user.isDrunk, user.isTarzan);
                }, dropTime);
            });

            // 5 saniye sonra uçağı domdan temizle
            setTimeout(() => {
                if (plane.parentNode) plane.parentNode.removeChild(plane);
                isPlaneFlying = false;
            }, 5000);
        }

        setupKickChatListener();

        // Sayfa yeniden boyutlandığında canvas ve fizik sınırlarını güncelle
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;

            // Zemin ve duvarları yeni boyutlara göre konumlandırmak gerekirse ekstra kod buraya yazılabilir.
        });

        // Konsoldan test edebilmeniz için global'e açıyoruz
        window.testAtla = () => spawnCharacter("TestUser");

        // Toplu atlayış testi için
        window.topluAtla = (kisiSayisi = 20) => {
            console.log(`${kisiSayisi} kişilik toplu atlayış başlatıldı!`);
            const fakeUsers = ["Ahmet", "Mehmet", "Ayşe", "Fatma", "Osman", "Ali", "Veli", "Canan", "Ece", "Kaan", "Cem", "Nur", "Burak", "Selin"];
            for (let i = 0; i < kisiSayisi; i++) {
                // Hepsi aynı anda düşerse oyun kasabilir veya hepsi birbirine çok girer
                // Bu yüzden 150 milisaniye aralıklarla teker teker atlıyorlar
                setTimeout(() => {
                    const randomUser = fakeUsers[Math.floor(Math.random() * fakeUsers.length)] + i;
                    spawnCharacter(randomUser);
                }, i * 150);
            }
        };

        console.log("Tekli test için konsola window.testAtla() yazabilirsiniz.");
        console.log("Toplu test için konsola window.topluAtla(30) yazabilirsiniz.");

        // --- ÖZEL TEST SENARYOSU (SADECE YENİ KARAKTERLER) ---
        window.testYeniler = () => {
            console.log("Sadece yeni eklenen 5 karakter test ediliyor...");
            
            // Orjinal listeyi yedeğe alıp sadece yenileri bırakıyoruz
            const orjinalConfig = [...charConfigs];
            charConfigs.length = 0;
            charConfigs.push(
                { file: 'characterfrog.png', scale: 0.053, radius: 36, yOffset: 0 },
                { file: 'charactercat3.png', scale: 0.110, radius: 28, yOffset: 0 },
                { file: 'charactercat2.png', scale: 0.200, radius: 44, yOffset: 0 },
                { file: 'characterdog2.png', scale: 0.200, radius: 44, yOffset: 0 },
                { file: 'charactersticth.png', scale: 0.180, radius: 40, yOffset: 0 }
            );

            let count = 0;
            const isimler = ['Kurbik', 'Kedi3', 'Kedi2', 'Kopek2', 'Sticth'];
            const interval = setInterval(() => {
                spawnCharacter(isimler[count]);
                count++;
                if (count >= 5) {
                    clearInterval(interval);
                    // Atlayışlar bitince listeyi eski haline getir
                    setTimeout(() => {
                        charConfigs.length = 0;
                        orjinalConfig.forEach(c => charConfigs.push(c));
                    }, 1000);
                }
            }, 800); // Her birini 0.8 saniye arayla atlat
        };

        // --- UÇAK İLE TOPLU ATLAYIŞ (DROP TOGETHER) TEST SENARYOSU ---
        window.testUcakAtlayisi = () => {
            console.log("Uçak test senaryosu başlatılıyor... 15 kişi sıraya ekleniyor.");
            
            // Sırayı sahte izleyicilerle doldur
            isDropTogetherMode = true;
            dropTogetherQueue = [];
            const testIsimleri = ["Ahmet", "Mehmet", "Ayşe", "Fatma", "Ali", "Veli", "Canan", "Ece", "Kaan", "Cem", "Nur", "Burak", "Selin", "Oğuz", "Zeynep"];
            
            testIsimleri.forEach(isim => {
                dropTogetherQueue.push({ username: isim, customEmoteUrl: null });
            });

            // Uçağı çağır
            isDropTogetherMode = false;
            triggerPlaneDrop();
        };

        // --- HELİKOPTER DIVE TEST SENARYOSU ---
        window.testHelikopterler = () => {
            console.log("Helikopter test senaryosu başlatılıyor... 9 helikopter sırayla geçecek.");
            let count = 1;
            
            const testLoop = () => {
                if (count > 9) {
                    console.log("Tüm helikopter testleri tamamlandı.");
                    return;
                }
                
                console.log(`Helikopter ${count} çağrılıyor...`);
                // Helikopter numarasını (count) forcedHeliNo olarak gönder
                triggerHelicopterDrop(`Diver${count}`, null, count);
                count++;
                
                // Her helikopterin geçişi 5 sn sürüyor, diğeri 5.5 saniye sonra gelsin
                setTimeout(testLoop, 5500);
            };
            
            testLoop(); // Döngüyü başlat
        };

        // Sayfa tarayıcıda açıldıktan 2 saniye sonra helikopter testi otomatik olarak başlar. (Kapatıldı)
        /*
        setTimeout(() => {
            window.testHelikopterler();
        }, 2000);
        */

    </script>
