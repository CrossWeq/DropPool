<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Chat Etkileşimli Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* OBS'te arkaplanın şeffaf olması için zorunlu */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            background-repeat: repeat-x;
            opacity: 0;
            /* Sayfa yenilendiğinde ilk açılışta yanıp sönmeyi (flash) önler */
        }

        /* Canvas tüm ekranı (OBS kaynağını) kaplasın */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Küçük mod zemin div'leri */
        .bg-split-left,
        .bg-split-right {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            background-repeat: no-repeat;
            background-position-y: bottom;
            z-index: -1;
            /* Havuzun her zaman ön planda (canvas üstte) olması için -1 yapıldı */
            pointer-events: none;
        }

        .bg-split-left {
            left: 0;
            /* Sağ kenardan hafif aşarak tam ortada birleşsin */
            background-position-x: left;
            /* clip: soldaki görselin sağ yarısından kesiyoruz */
            clip-path: inset(0 0 0 0);
        }

        .bg-split-right {
            right: 0;
            background-position-x: right;
        }

        @keyframes heliBobbing {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-6px) rotate(1deg);
            }

            50% {
                transform: translateY(0px) rotate(0deg);
            }

            75% {
                transform: translateY(6px) rotate(-1deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }
    </style>
    <!-- Matter.js fizik motoru CDN üzerinden dahil ediliyor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Pusher JS kütüphanesi (Kick Canlı Sohbet için) -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <!-- Canvas Confetti kütüphanesi (Doğum günü patlamaları için) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>

<body>

    <script>
        // --- 1. AYARLAR VE DEĞİŞKENLER ---
        const urlParams = new URLSearchParams(window.location.search);
        // Platform seçimi: plat=kick (varsayılan) | twitch | both. Twitch kanalı: ?twitch=kanaladi (twitch modunda kanal adı 'kanal' içinde de gelir)
        const platParam = (urlParams.get('plat') || 'kick').toLowerCase();
        const usePlatKick = platParam !== 'twitch';
        const useTwitch = platParam === 'twitch' || platParam === 'both';
        const twitchChannelName = (urlParams.get('twitch') || (platParam === 'twitch' ? urlParams.get('kanal') : '') || '')
            .replace(/^https?:\/\/(www\.)?twitch\.tv\//i, '').replace(/^@+/, '').replace(/^#+/, '').trim().toLowerCase();
        const rawChannelName = urlParams.get('kanal') || 'testkanal';
        const channelName = rawChannelName.replace(/^https?:\/\/(www\.)?kick\.com\//i, '').replace(/^@+/, '').trim();
        const commandStr = urlParams.get('cmd') || '!atla';
        const cooldownSec = parseFloat(urlParams.get('cd')) || 60;
        const showBackground = urlParams.get('bg') !== '0'; // Varsayılan olarak true (1)
        const showTrail = urlParams.get('tr') !== '0'; // Varsayılan olarak true (1)
        const overlayLang = (urlParams.get('lang') || 'tr').toLowerCase(); // 'tr' veya 'en'

        // --- DOĞUM GÜNÜ TEMASI KONTROLÜ ---
        const birthMonth = parseInt(urlParams.get('bm'));
        const birthDay = parseInt(urlParams.get('bd'));
        let isBirthdayMode = false;

        function checkBirthdayStatus() {
            if (!isNaN(birthMonth) && !isNaN(birthDay)) {
                const today = new Date();

                // Artık yıl olmayan yıllarda 29 Şubat için 28 Şubat esnekliği
                const isLeapYear = (y) => (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);

                // Bu yılın doğum günü tarihi
                const targetDayThisYear = (birthMonth === 2 && birthDay === 29 && !isLeapYear(today.getFullYear())) ? 28 : birthDay;
                let birthdayThisYear = new Date(today.getFullYear(), birthMonth - 1, targetDayThisYear, 0, 0, 0);

                // Geçen yılın doğum günü tarihi (Yılbaşı geçişi - 31 Aralık gecesi - için gerekli)
                const targetDayLastYear = (birthMonth === 2 && birthDay === 29 && !isLeapYear(today.getFullYear() - 1)) ? 28 : birthDay;
                let birthdayLastYear = new Date(today.getFullYear() - 1, birthMonth - 1, targetDayLastYear, 0, 0, 0);

                // Bitiş saatleri: Doğum gününden 30 saat sonra (Ertesi gün sabah 06:00)
                let endDateThisYear = new Date(birthdayThisYear.getTime() + (30 * 60 * 60 * 1000));
                let endDateLastYear = new Date(birthdayLastYear.getTime() + (30 * 60 * 60 * 1000));

                let isPartyTime = (today >= birthdayThisYear && today < endDateThisYear) ||
                    (today >= birthdayLastYear && today < endDateLastYear);

                if (isPartyTime) {
                    if (!isBirthdayMode) {
                        isBirthdayMode = true;
                        window.isBirthdayMode = true; // global erişim için
                        console.log("Bugün yayıncının doğum günü (veya kutlaması devam ediyor)! Doğum günü teması aktif!");
                    }
                } else {
                    if (isBirthdayMode) {
                        isBirthdayMode = false;
                        window.isBirthdayMode = false; // global erişim için
                        console.log("Doğum günü kutlaması bitti, normal temaya dönülüyor.");
                    }
                }
            }
        }

        // Sayfa ilk yüklendiğinde bir kez kontrol et
        checkBirthdayStatus();

        // Gece 00:00 geçişlerini yakalamak için her 1 dakikada (60000 ms) bir tarihi gizlice kontrol et
        setInterval(checkBirthdayStatus, 60000);

        // Tetikleyici kelimeyi başlık için hazırla (baştaki !, / gibi özel karakterleri kaldır, ilk harfi büyüt)
        function getTriggerWord(cmd) {
            let word = cmd.trim().replace(/^[!\/@#$%^&*]+/, ''); // Baştaki özel karakterleri sil
            if (!word) word = 'Atla';
            return word.charAt(0).toUpperCase() + word.slice(1);
        }
        const triggerWord = getTriggerWord(commandStr);
        const rankingWord = overlayLang === 'en' ? 'Ranking' : 'Sıralaması';
        const leaderboardTitle = `${triggerWord} ${rankingWord}`;

        const activeThemesParams = urlParams.get('t') ? urlParams.get('t').split(',') : ['0', '1', '2', '3'];
        const activeThemesIndices = activeThemesParams.map(Number);

        const activeParachutesParams = urlParams.get('p') ? urlParams.get('p').split(',') : ['11', '12', '13', '14', '15', '16', '17', '18'];
        const activeParachutes = activeParachutesParams.map(Number);

        // Havuz boyutu: ps=0 → küçük, ps=1 veya parametre yok → normal (mevcut linkler bozulmaz)
        const poolSizeParam = urlParams.get('ps');
        const isSmallPool = poolSizeParam === '0';

        const userCooldowns = new Map();

        function checkCooldown(username) {
            if (cooldownSec <= 0) return true;
            const now = Date.now();
            const lastTime = userCooldowns.get(username);
            if (!lastTime || (now - lastTime) >= cooldownSec * 1000) {
                userCooldowns.set(username, now);
                return true;
            }
            return false;
        }

        console.log(`Bağlanılan kanal: ${channelName} | Komut: ${commandStr} | Cooldown: ${cooldownSec}s`);

        // --- TEMA VE OVERLAY GÖRÜNÜRLÜK SİSTEMİ ---
        const themes = [
            { bg: 'pixelgrass.png', pool: 'pixelpool.png', bgOffset: 150 },
            { bg: 'pixelautumn.png', pool: 'pixelpoolautumn.png', bgOffset: 250 },
            { bg: 'pixelice.png', pool: 'pixelpoolice.png', bgOffset: 90 },
            { bg: 'pixelhell.png', pool: 'pixelpoolhell.png', bgOffset: 220 }
        ];

        let isOverlayVisible = false;
        document.body.style.opacity = '0'; // Başlangıçta gizli
        document.body.style.transition = 'none'; // İlk başta geçiş yok

        let overlayIdleTimerRef = null;
        let activeVehicles = 0; // Helikopter veya uçak havada mı?
        let overlayIdleTimer = null;
        // Idle timer'a artık gerek yok çünkü aktif karakter bittiğinde kapanıyor, ama fonksiyonu boş bırakıyoruz
        function resetIdleTimer() {
        }

        function applyRandomTheme() {
            let randomTheme;
            if (isBirthdayMode) {
                // Doğum günü temasında zemin pixelgrass, havuz ise rastgele bir pasta (cake1 - cake5) olur
                const randomCakeNum = Math.floor(Math.random() * 5) + 1;
                // Pastalar havuzla aynı boyutta görünsün diye özel scale (ölçek) uyguluyoruz
                const cakeScale = isSmallPool ? 0.20 : 0.32;
                randomTheme = { bg: 'pixelgrass.png', pool: `party/cake${randomCakeNum}.png`, bgOffset: 150, poolScale: cakeScale };
            } else {
                const activeThemesArr = themes.filter((t, index) => activeThemesIndices.includes(index));
                const listToUse = activeThemesArr.length > 0 ? activeThemesArr : themes;
                randomTheme = listToUse[Math.floor(Math.random() * listToUse.length)];
            }

            if (showBackground) {
                if (isSmallPool) {
                    // Küçük mod: body background'ı temizle, iki ayrı div ile zemin oluştur
                    document.body.style.backgroundImage = 'none';

                    // Eski div'leri temizle
                    const oldLeft = document.getElementById('bg-left');
                    const oldRight = document.getElementById('bg-right');
                    if (oldLeft) oldLeft.remove();
                    if (oldRight) oldRight.remove();

                    // Görselin gerçek boyutunu ölçmek için geçici Image kullan
                    const img = new Image();
                    img.src = randomTheme.bg;
                    img.onload = () => {
                        const naturalW = img.naturalWidth;
                        const naturalH = img.naturalHeight;

                        // %60 boyutlu görselin piksel boyutları
                        const scaledW = naturalW * 0.60;
                        const scaledH = naturalH * 0.60;

                        // Görselin sağ kenar ortadan taşıyor mu? Evet: sol div sağdan kesin
                        // Ekranın yarısı = window.innerWidth / 2
                        // Sol div: sola yapıştır, sağ kenarı ekran ortasında bitsin
                        // Sağ div: sağa yapıştır, sol kenarı ekran ortasında bitsin
                        // Her iki div'in clip noktası: görselin ortada çakıştığı kısım budur

                        const bgSize = `${scaledW}px ${scaledH}px`;
                        const bgYPos = `calc(100% + ${Math.round(randomTheme.bgOffset * 0.60)}px)`;

                        // Sol div
                        const leftDiv = document.createElement('div');
                        leftDiv.id = 'bg-left';
                        leftDiv.className = 'bg-split-left';
                        leftDiv.style.backgroundImage = `url('${randomTheme.bg}')`;
                        leftDiv.style.backgroundSize = bgSize;
                        leftDiv.style.backgroundPosition = `left ${bgYPos}`; // soldan hizala
                        document.body.appendChild(leftDiv);

                        // Sağ div
                        const rightDiv = document.createElement('div');
                        rightDiv.id = 'bg-right';
                        rightDiv.className = 'bg-split-right';
                        rightDiv.style.backgroundImage = `url('${randomTheme.bg}')`;
                        rightDiv.style.backgroundSize = bgSize;
                        rightDiv.style.backgroundPosition = `right ${bgYPos}`; // sağdan hizala
                        document.body.appendChild(rightDiv);
                    };
                } else {
                    // Normal mod: eski iki parçalı div varsa temizle, body'e tek background yap
                    const oldLeft = document.getElementById('bg-left');
                    const oldRight = document.getElementById('bg-right');
                    if (oldLeft) oldLeft.remove();
                    if (oldRight) oldRight.remove();

                    document.body.style.backgroundImage = `url('${randomTheme.bg}')`;
                    document.body.style.backgroundPosition = `center calc(100% + ${randomTheme.bgOffset}px)`;
                }
            } else {
                document.body.style.backgroundImage = 'none';
                const oldLeft = document.getElementById('bg-left');
                const oldRight = document.getElementById('bg-right');
                if (oldLeft) oldLeft.remove();
                if (oldRight) oldRight.remove();
            }

            // Eğer pool objesi daha önceden oluşturulmuşsa görselini ve konumunu güncelle
            if (typeof pool !== 'undefined' && pool.render && pool.render.sprite) {
                pool.render.sprite.texture = randomTheme.pool;

                // Havuza özel scale varsa onu kullan, yoksa tanımlı poolSpriteScale'i kullan
                const scale = randomTheme.poolScale !== undefined ? randomTheme.poolScale : poolSpriteScale;
                pool.render.sprite.xScale = scale;
                pool.render.sprite.yScale = scale;

                // Havuzu her oyun açılışında rastgele bir X konumuna taşı
                const newPoolX = Math.random() * (width - poolMargin * 2) + poolMargin;
                Matter.Body.setPosition(pool, { x: newPoolX, y: poolY });
                console.log("Havuz yeni rastgele konuma taşındı: X =", newPoolX);
            }
            console.log("Yeni takım teması uygulandı:", randomTheme.bg, "Offset:", randomTheme.bgOffset);
        }

        // --- ATLA SIRALAMASI SİSTEMİ & OBS SENKRONİZASYONU ---
        const syncChannel = new BroadcastChannel('droppool_channel');
        let leaderboard = []; // Her sayfa yenilendiğinde sıfırdan başlar

        // --- TOPLU ATLAYIŞ (DROP TOGETHER) VE GERİ SAYIM DEĞİŞKENLERİ ---
        let isDropTogetherMode = false;
        let isMeteorMode = false;
        // Aktif toplu atlayış/meteor oturumunu kimin başlattığı: 'broadcaster' | 'admin' | null. Sadece sahibi kaldırabilir.
        let modeOwner = null;
        let dropTogetherQueue = [];
        let isPlaneFlying = false;
        // !resetdrop her çağrıldığında artırılır; eski (iptal edilmiş) gecikmeli işlemlerin ve zamanlayıcıların etkisiz kalmasını sağlar
        let sceneEpoch = 0;

        // Otomatik süreli atlayış durum değişkenleri (!droptogether 100, !admindroptogether 20 vb.)
        let countdownTimerId = null;
        let countdownTargetEpoch = 0;
        let countdownModeKind = null; // 'plane' | 'meteor'
        let countdownByAdmin = false;
        let countdownInitiator = null;

        function wakeOverlay() {
            if (!isOverlayVisible) {
                isOverlayVisible = true;
                if (typeof pool !== 'undefined' && pool && pool.render) pool.render.visible = true;
                if (typeof applyRandomTheme === 'function') applyRandomTheme();
                document.body.style.transition = 'none';
                document.body.style.opacity = '1';
                console.log("[DropPool] Overlay açıldı.");
            }
            if (overlayIdleTimerRef) {
                clearTimeout(overlayIdleTimerRef);
                overlayIdleTimerRef = null;
            }
        }

        function clearCountdown() {
            if (countdownTimerId) {
                clearTimeout(countdownTimerId);
                countdownTimerId = null;
            }
            countdownTargetEpoch = 0;
            countdownModeKind = null;
            countdownByAdmin = false;
            countdownInitiator = null;
        }

        function executeAutoDrop(kind, byAdmin, initiatorUser) {
            if (sceneEpoch !== countdownTargetEpoch) return;

            const isMeteor = (kind === 'meteor');
            const streamerName = (typeof channelName === 'string' && channelName) ? channelName : initiatorUser;

            if (byAdmin) {
                // Admin başlattıysa: Admin, Yayıncı ve chatten !atla yazan izleyiciler katılır
                if (initiatorUser && !dropTogetherQueue.some(u => u.username.toLowerCase() === initiatorUser.toLowerCase())) {
                    dropTogetherQueue.unshift({
                        username: initiatorUser,
                        customEmoteUrl: null,
                        isDrunk: false,
                        isTarzan: false,
                        isFake: false
                    });
                    addDropPoolLog(initiatorUser, 'SİSTEM', isMeteor ? 'Admin meteor yağmuruna otomatik eklendi.' : 'Admin toplu atlayışa otomatik eklendi.');
                    updateDropPoolStats(initiatorUser, 'JUMP');
                }
                if (streamerName && !dropTogetherQueue.some(u => u.username.toLowerCase() === streamerName.toLowerCase())) {
                    dropTogetherQueue.unshift({
                        username: streamerName,
                        customEmoteUrl: null,
                        isDrunk: false,
                        isTarzan: false,
                        isFake: false
                    });
                    addDropPoolLog(streamerName, 'SİSTEM', isMeteor ? 'Yayıncı meteor yağmuruna otomatik eklendi.' : 'Yayıncı toplu atlayışa otomatik eklendi.');
                    updateDropPoolStats(streamerName, 'JUMP');
                }
            } else {
                // Yayıncı başlattıysa: Yayıncı otomatik katılır
                const streamerFinal = initiatorUser || streamerName;
                if (streamerFinal && !dropTogetherQueue.some(u => u.username.toLowerCase() === streamerFinal.toLowerCase())) {
                    dropTogetherQueue.unshift({
                        username: streamerFinal,
                        customEmoteUrl: null,
                        isDrunk: false,
                        isTarzan: false,
                        isFake: false
                    });
                    addDropPoolLog(streamerFinal, 'SİSTEM', isMeteor ? 'Yayıncı meteor yağmuruna otomatik eklendi.' : 'Yayıncı toplu atlayışa otomatik eklendi.');
                    updateDropPoolStats(streamerFinal, 'JUMP');
                }
            }

            clearCountdown();
            isDropTogetherMode = false;
            isMeteorMode = false;
            modeOwner = null;

            if (dropTogetherQueue.length === 0) {
                console.log('[DropPool] Kuyrukta kimse yok, otomatik atlayış iptal edildi.');
                return;
            }

            addDropPoolLog('SİSTEM', 'SİSTEM', isMeteor ? 'Süre doldu! Otomatik meteor yağmuru başladı.' : 'Süre doldu! Otomatik toplu atlayış (uçak) havalandı.');

            if (isMeteor) {
                triggerMeteorShower();
            } else {
                triggerPlaneDrop();
            }
        }

        // Sayfa her açıldığında/yenilendiğinde sıralamayı sıfırla ve siralama.html'e bildir
        try {
            localStorage.removeItem('droppool_leaderboard');
        } catch (e) { }
        syncChannel.postMessage({ type: 'LEADERBOARD_RESET' });
        // Başlık bilgisini siralama.html'e gönder (sayfa yenilenince de güncellenir)
        syncChannel.postMessage({ type: 'TITLE_UPDATE', title: leaderboardTitle });

        function updateLeaderboard(username, score) {
            score = parseFloat(score);
            if (isNaN(score)) return;

            const existingIndex = leaderboard.findIndex(x => x.username.toLowerCase() === username.toLowerCase());
            if (existingIndex !== -1) {
                // Kullanıcının daha önceki skorundan yüksekse güncelle
                if (score > leaderboard[existingIndex].score) {
                    leaderboard[existingIndex].score = score;
                }
            } else {
                leaderboard.push({ username, score });
            }

            // Puana göre büyükten küçüğe sırala ve en iyi 5'i tut
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);

            try {
                localStorage.setItem('droppool_leaderboard', JSON.stringify(leaderboard));
            } catch (e) { }
            syncChannel.postMessage({ type: 'LEADERBOARD_UPDATE', leaderboard });
        }

        // Sıralamayı manuel sıfırlamak için global fonksiyon
        window.resetLeaderboard = function () {
            leaderboard = [];
            try {
                localStorage.removeItem('droppool_leaderboard');
            } catch (e) { }
            syncChannel.postMessage({ type: 'LEADERBOARD_RESET' });
            console.log("Atla Sıralaması sıfırlandı!");
        };

        function addDropPoolLog(username, action, detail) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const logEntry = {
                time: timeString,
                username: username,
                action: action,
                detail: detail
            };

            try {
                let logs = [];
                const existing = localStorage.getItem('droppool_logs');
                if (existing) {
                    logs = JSON.parse(existing);
                }
                logs.push(logEntry);

                if (logs.length > 500) {
                    logs = logs.slice(logs.length - 500);
                }

                localStorage.setItem('droppool_logs', JSON.stringify(logs));
                syncChannel.postMessage({ type: 'NEW_LOG', log: logEntry });
            } catch (e) {
                console.error("Log kaydetme hatası:", e);
            }
        }

        function updateDropPoolStats(username, type, score = 0) {
            try {
                let stats = {};
                const existing = localStorage.getItem('droppool_stats');
                if (existing) {
                    stats = JSON.parse(existing);
                }

                const lowerUser = username.toLowerCase();
                const now = new Date();
                const dateTimeString = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

                if (!stats[lowerUser]) {
                    stats[lowerUser] = { username: username, jumps: 0, maxScore: 0, hits: 0, totalScore: 0, lastJumpTime: dateTimeString };
                } else {
                    stats[lowerUser].username = username; // Update casing just in case
                    if (stats[lowerUser].hits === undefined) stats[lowerUser].hits = 0;
                    if (stats[lowerUser].totalScore === undefined) stats[lowerUser].totalScore = 0;
                    stats[lowerUser].lastJumpTime = dateTimeString;
                }

                if (type === 'JUMP') {
                    stats[lowerUser].jumps += 1;
                } else if (type === 'SCORE') {
                    stats[lowerUser].hits += 1;
                    stats[lowerUser].totalScore += score;
                    if (score > stats[lowerUser].maxScore) {
                        stats[lowerUser].maxScore = score;
                    }
                }

                localStorage.setItem('droppool_stats', JSON.stringify(stats));
                syncChannel.postMessage({ type: 'STATS_UPDATE', stats: stats });
            } catch (e) {
                console.error("Stats kaydetme hatası:", e);
            }
        }

        // --- 2. MATTER.JS KURULUMU ---
        const Engine = Matter.Engine,
            Render = Matter.Render,
            Runner = Matter.Runner,
            Bodies = Matter.Bodies,
            Composite = Matter.Composite,
            Events = Matter.Events,
            Body = Matter.Body,
            Constraint = Matter.Constraint,
            Composites = Matter.Composites;

        // Fizik motorunu oluştur
        const engine = Engine.create();
        const world = engine.world;

        // Render (Çizim) modülünü oluştur
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false, // Gerçekçi görünümler (renk/texture) kullanılsın
                background: 'transparent' // Render arkaplanı da şeffaf olsun
            }
        });

        Render.run(render);

        // Fizik simülasyonunu başlat
        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- 3. DUVARLAR VE ZEMİN (ÇEVRE) ---
        const width = window.innerWidth;
        const height = window.innerHeight;
        const wallThickness = 60;

        // Sol Duvar (Görünmez, zıplama/sekme katsayısı yüksek)
        const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, {
            isStatic: true,
            restitution: 1, // Aynı hızla geri dönsün (yavaşlama yok)
            render: { visible: false } // Ekranda görünmesin
        });

        // Sağ Duvar (Görünmez, zıplama/sekme katsayısı yüksek)
        const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, {
            isStatic: true,
            restitution: 1,
            render: { visible: false }
        });

        // Genel Zemin (Havuzu tutturamayanların düşeceği görünmez düz zemin)
        const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width, wallThickness, {
            isStatic: true,
            isSensor: false,
            label: 'zemin',
            render: { visible: false }
        });

        // Havuz Görseli ve Hitbox Ayarları (Görsel biraz daha küçültüldü)
        const poolSpriteScale = isSmallPool ? 0.084 : 0.14; // %60'a (0.60) ayarlandı
        const poolHitboxRadiusX = isSmallPool ? 72 : 120; // 120 * 0.60
        const poolHitboxRadiusY = isSmallPool ? 19 : 32;  // 32 * 0.60

        // Havuzun sağa sola rastgele (random) doğması için güvenli X ekseni aralığı
        const poolMargin = poolHitboxRadiusX + 60;
        const randomPoolX = Math.random() * (width - poolMargin * 2) + poolMargin;
        const poolY = height - (isSmallPool ? 21 : 35); // %60 oranına göre zemin hizalaması

        const pool = Bodies.circle(randomPoolX, poolY, poolHitboxRadiusX, {
            isStatic: true,
            isSensor: false,
            label: 'hedefZemin',
            render: {
                sprite: {
                    texture: 'pixelpool.png',
                    xScale: poolSpriteScale,
                    yScale: poolSpriteScale
                },
                visible: true
            }
        });

        // Daireyi dikeyde basık elips yaparak tam havuzun su yüzeyine oturtuyoruz
        Matter.Body.scale(pool, 1.0, poolHitboxRadiusY / poolHitboxRadiusX);

        // Scale işlemi sprite'ı bozmasın diye görsel oranlarını sabitliyoruz:
        pool.render.sprite.xScale = poolSpriteScale;
        pool.render.sprite.yScale = poolSpriteScale;

        // İstendiğinde havuzun yerini tekrar rastgele değiştirmek için global fonksiyon
        window.randomizePoolPosition = function () {
            const newX = Math.random() * (width - poolMargin * 2) + poolMargin;
            Matter.Body.setPosition(pool, { x: newX, y: poolY });
            console.log("Havuz yeni rastgele konuma taşındı: X =", newX);
        };
        // --- 4. KARAKTER SPAWN FONKSİYONU ---
        const charImagesMap = {};
        const charConfigs = [
            // Sadece yeni eklenen karakterler (Test için)
            // Kalp (characterhurt): İstenen orta boyuta getirildi ve biraz aşağı (yOffset: 2) alındı
            { file: 'characterhurt.png', scale: 0.013, radius: 9, yOffset: 2, nameYOffset: 20 },
            // Köpek (characterdog): 1.2x büyütüldü ve biraz aşağı alındı
            { file: 'characterdog.png', scale: 0.036, radius: 24, yOffset: 3 },
            // Diğer Karakterler
            { file: 'chracteralien.png', scale: 0.020, radius: 16, yOffset: 0 },
            { file: 'chractercat.png', scale: 0.030, radius: 20, yOffset: -2 },
            { file: 'chracterchef.png', scale: 0.100, radius: 30, yOffset: 2 },
            // Yeni Eklenen Karakterler
            { file: 'characterfrog.png', scale: 0.058, radius: 36, yOffset: 0 }, // 1.1x büyütüldü (eski 0.053)
            { file: 'charactercat3.png', scale: 0.100, radius: 25, yOffset: 0 }, // 1.1x küçültüldü
            { file: 'charactercat2.png', scale: 0.200, radius: 44, yOffset: 0 }, // Daha da büyütüldü
            { file: 'characterdog2.png', scale: 0.200, radius: 44, yOffset: 0 },
            { file: 'charactersticth.png', scale: 0.180, radius: 40, yOffset: 0 } // Çok az küçültüldü
        ];

        // --- DOĞUM GÜNÜ PARTİ KARAKTERLERİ ---
        // Yeni görsellerin hepsi muhtemelen aynı boyutta dışa aktarıldığı için, farklı scale değerleri bazılarını devasa, bazılarını minicik yaptı.
        // Hepsine ortak ve dengeli bir scale/radius veriyoruz:
        const partyCharConfigs = [
            { file: 'party/partycharactercat.png', scale: 0.200, radius: 35, yOffset: 0 }, // 1.1x küçültüldü
            { file: 'party/partycharactercat2.png', scale: 0.080, radius: 35, yOffset: 0 },
            { file: 'party/partycharactercat3.png', scale: 0.110, radius: 35, yOffset: 0 }, // 1.1x büyütüldü
            { file: 'party/partycharacterchef.png', scale: 0.250, radius: 35, yOffset: 0 }, // 2.5x büyütüldü
            { file: 'party/partycharacterdog.png', scale: 0.100, radius: 35, yOffset: 0 },
            { file: 'party/partycharacterfrog.png', scale: 0.160, radius: 35, yOffset: 0 }, // 1.6x büyütüldü
            { file: 'party/partycharactersticth.png', scale: 0.200, radius: 35, yOffset: 0 } // 2.5x büyütüldü
        ];

        // Manuel çizim için karakter resimlerini önceden yüklüyoruz
        [...charConfigs, ...partyCharConfigs].forEach(cfg => {
            let img = new Image();
            img.src = cfg.file;
            charImagesMap[cfg.file] = img;
        });

        let jetpackImg = new Image();
        jetpackImg.src = 'jetback.png';
        charImagesMap['jetback.png'] = jetpackImg;

        // --- ÖNDEN YÜKLEME (PRELOAD): Paraşüt, zemin, havuz, helikopter, uçak ---
        // Bu görseller ilk kullanımda fizik döngüsü içinde yüklenirse donmaya (freeze) yol açar.
        // Sayfa açılışında hepsini tarayıcı önbelleğine alıyoruz.
        (function preloadAllAssets() {
            const filesToPreload = [
                // Tüm paraşütler (15-18 arası büyük dosyalar — en kritikleri bunlar)
                'parasut11.png', 'parasut12.png', 'parasut13.png', 'parasut14.png',
                'parasut15.png', 'parasut16.png', 'parasut17.png', 'parasut18.png',
                // Zemin görselleri
                'pixelgrass.png', 'pixelautumn.png', 'pixelice.png', 'pixelhell.png',
                // Havuz görselleri
                'pixelpool.png', 'pixelpoolautumn.png', 'pixelpoolice.png', 'pixelpoolhell.png',

            ];
            filesToPreload.forEach(file => {

                charImagesMap[file] = img;
            });
            console.log('[DropPool] Tüm görseller önceden yükleniyor:', filesToPreload.length, 'dosya');
        })();
        // --- ÖNDEN YÜKLEME SONU ---

        Composite.add(world, [leftWall, rightWall, ground, pool]);

        // --- 4. KARAKTER SPAWN FONKSİYONU ---
        function spawnCharacter(username, customEmoteUrl = null, spawnX = null, spawnY = -50, isDive = false, isDrunk = false, isTarzan = false, isFake = false, isMeteor = false, meteorVx = null, meteorVy = null) {
            // Eğer ekran kapalıysa aç ve yeni tema belirle
            wakeOverlay();
            // Her yeni kişi düştüğünde boşta kalma süresini sıfırla (60dk zamanlayıcısı)
            resetIdleTimer();

            let actualSpawnY = spawnY;
            // Rastgele X pozisyonu (kenarlara çok yakın olmasın)
            let randomX = spawnX !== null ? spawnX : (Math.random() * (width - 100) + 50);

            if (isMeteor) {
                randomX = Math.random() * (width - 100) + 50;
                actualSpawnY = -200 - Math.random() * 200; // Ekranın oldukça üstünden başlasın
            }

            let tarzanAnchorX = 0;
            let tarzanAnchorY = -50;
            let tarzanFromLeft = true;

            if (isTarzan) {
                // SARKAÇ MATEMATİĞİ:
                // Anchor ekranın tam tepesinde, ortada (görünmez nokta)
                // Karakter ekranın kenarında, orta yükseklikte başlar
                // Yerçekimi + kısıtlama = karakteri ekranın ortasına doğru fırlatır
                tarzanFromLeft = Math.random() < 0.5;

                // Anchor: İp hep tam ortadan değil, rastgele sağdan/soldan gelebilsin
                tarzanAnchorX = (width / 2) + (Math.random() * 600 - 300);

                // İpin en üst noktası tam ekranın en üst noktası olsun
                tarzanAnchorY = 0;

                // Karakterin başlangıç noktası da daha yukarı alındı ki ip kısa kalmaya devam etsin
                let baseStartX = tarzanFromLeft ? (width / 4) : (width * 3 / 4);
                randomX = baseStartX + (Math.random() * 200 - 100);
                actualSpawnY = (height / 5) + (Math.random() * 100 - 50);
            }

            let randomChar;
            let customDomElement = null;

            if (customEmoteUrl) {
                // Emote boyutları 1.5x büyütüldü (radius: 24 -> 36, width/height: 48 -> 72)
                randomChar = { file: customEmoteUrl, scale: 1, radius: 36, yOffset: 0, nameYOffset: 5, isCustom: true };

                // Animasyonlu emote (GIF/WEBP) desteği için DOM (img) elemanı oluşturuyoruz
                customDomElement = document.createElement('img');
                customDomElement.src = customEmoteUrl;
                customDomElement.className = 'custom-emote';
                customDomElement.style.position = 'absolute';
                customDomElement.style.width = isSmallPool ? '43px' : '72px'; // %60'ı (43.2px)
                customDomElement.style.height = isSmallPool ? '43px' : '72px';
                customDomElement.style.objectFit = 'contain';
                customDomElement.style.left = '-1000px';
                customDomElement.style.top = '-1000px';
                customDomElement.style.transform = 'translate(-50%, -50%)'; // Merkezlemek için
                customDomElement.style.pointerEvents = 'none';
                customDomElement.style.zIndex = '20'; // Canvas'ın üstünde olması için
                document.body.appendChild(customDomElement);

            } else {
                let baseChar;
                if (isBirthdayMode) {
                    baseChar = partyCharConfigs[Math.floor(Math.random() * partyCharConfigs.length)];
                } else {
                    baseChar = charConfigs[Math.floor(Math.random() * charConfigs.length)];
                }
                randomChar = { ...baseChar }; // Referansla değiştirmemek için kopyalıyoruz
            }

            if (isSmallPool) {
                randomChar.radius = randomChar.radius * 0.60;
                if (randomChar.scale) randomChar.scale = randomChar.scale * 0.60;
                if (randomChar.yOffset) randomChar.yOffset = randomChar.yOffset * 0.60;
                if (randomChar.nameYOffset) randomChar.nameYOffset = randomChar.nameYOffset * 0.60;
            }

            // Karakter objesini oluştururken görselin (resmin) boyutuna uygun bir fiziksel çap (radius) veriyoruz ki yere batmasın.
            const character = Bodies.circle(randomX, actualSpawnY, randomChar.radius, {
                restitution: 0.1, // Karakterler birbirine çarpınca hafif sekmeli (duvarlar 0.9 olduğu için duvarda yine seker)
                frictionAir: 0, // Yatay hızını havada kaybetmemesi için
                friction: 0, // Duvarlara sürttüğünde yavaşlamaması için
                inertia: Infinity, // Çarpışmalarda fırıldak gibi dönmesini engeller
                label: 'karakter',
                render: {
                    fillStyle: 'transparent', // Matter.js'in kendi yuvarlağını çizmesini engelliyoruz (biz resmi manually çizeceğiz)
                    strokeStyle: 'transparent',
                    lineWidth: 0
                },
                // Özel verilerimizi saklayacağımız obje
                plugin: {
                    username: username,
                    parachuteOpened: false, // Paraşüt henüz açılmadı
                    charTexture: customEmoteUrl ? null : randomChar.file,
                    charScale: randomChar.scale,
                    charYOffset: randomChar.yOffset || 0,
                    nameYOffset: randomChar.nameYOffset || 0,
                    isCustom: randomChar.isCustom || false,
                    domElement: customDomElement,
                    isDive: isDive,
                    isDrunk: isDrunk,
                    isTarzan: isTarzan,
                    isFake: isFake,
                    isMeteor: isMeteor
                }
            });

            Composite.add(world, character);

            if (isMeteor) {
                // Başlangıç hızı: Ortak açı için meteorVx/meteorVy kullanılır, verilmemişse rastgele üretilir.
                // Hızı %10 daha düşürdük:
                let vx = meteorVx !== null ? meteorVx : ((Math.random() - 0.5) * 2.916);
                let vy = meteorVy !== null ? meteorVy : (5.832 + Math.random() * 2.916);
                Matter.Body.setVelocity(character, { x: vx, y: vy });
            }

            if (isTarzan) {
                // Karaktere başlangıç ivmesi ver: sarkaç daha hızlı başlasın
                // Sol kenardan geliyorsa sağa, sağ kenardan geliyorsa sola itilsin
                // Fırlatma hissini (salınımı) güçlendirmek için hız artırıldı
                const tarzanInitialVx = tarzanFromLeft ? 18 : -18;
                Body.setVelocity(character, { x: tarzanInitialVx, y: 2 });

                // Tek parça, düz ve sert bir ip constraint'i
                const tarzanConstraint = Constraint.create({
                    pointA: { x: tarzanAnchorX, y: tarzanAnchorY },
                    bodyB: character,
                    stiffness: 1,
                    damping: 0,
                    render: {
                        visible: true,
                        lineWidth: 3,
                        strokeStyle: '#8B4513'
                    }
                });

                Composite.add(world, tarzanConstraint);

                character.plugin.tarzanConstraint = tarzanConstraint;
                character.plugin.tarzanAnchorX = tarzanAnchorX;
                character.plugin.tarzanAnchorY = tarzanAnchorY;
                character.plugin.tarzanFromLeft = tarzanFromLeft;
                character.plugin.tarzanReleased = false;
                // Bazen çok erken bıraktığı için süre tekrar biraz artırıldı (600ms - 1200ms)
                character.plugin.tarzanReleaseTimer = engine.timing.timestamp + 600 + (Math.random() * 600);
            } else if (!isMeteor) {
                // Başlangıçta sağa veya sola rastgele yatay bir kuvvet uygula (dümdüz düşmemesi için)
                const randomForceX = (Math.random() - 0.5) * 0.08 * character.mass;
                Body.applyForce(character, { x: character.position.x, y: character.position.y }, { x: randomForceX, y: 0 });
            }
        }

        // --- 5. FİZİK GÜNCELLEMESİ (PARAŞÜT MEKANİĞİ) ---
        Events.on(engine, 'beforeUpdate', function () {
            const bodies = Composite.allBodies(world);

            // Dünyadaki tüm objeleri kontrol et
            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];

                // Sadece bizim oluşturduğumuz 'karakter' etiketli objeler için işlem yap
                if (body.label === 'karakter' && body.plugin) {

                    // --- DIVE MODU İÇİN ÖZEL DAVRANIŞ (PARAŞÜT İPTALİ VE HAVADA SPIN) ---
                    if (body.plugin.isDive) {
                        if (!body.plugin.landed) {
                            Matter.Body.setAngularVelocity(body, 0); // Dönme efektini tamamen kapattık
                            Matter.Body.setAngle(body, 0); // Havadayken dümdüz (dik) durması için açıyı kilitledik
                            Matter.Body.setVelocity(body, { x: 0, y: body.velocity.y }); // Sağa sola sapmayı (savrulmayı) tamamen engelle, dümdüz insin
                        }
                        continue; // Paraşüt açılma sınırlarını ve sarkaçları tamamen pas geç
                    }

                    // --- METEOR MODU İÇİN ÖZEL DAVRANIŞ ---
                    if (body.plugin.isMeteor) {
                        if (!body.plugin.landed) {
                            let angle = Math.atan2(body.velocity.y, body.velocity.x) - Math.PI / 2;
                            Matter.Body.setAngle(body, angle);
                        }
                        continue; // Paraşüt ve sarkaçları tamamen pas geç
                    }

                    // --- FAKE MODU İÇİN ÖZEL DAVRANIŞ ---
                    if (body.plugin.isFake) {
                        if (!body.plugin.landed) {
                            if (!body.plugin.fakeJetpackActivated) {
                                // Rota hesaplama (Sadece bir kez)
                                if (!body.plugin.fakePathCalculated) {
                                    body.plugin.fakePathCalculated = true;

                                    let poolCenterX = (typeof pool !== 'undefined' && pool) ? pool.position.x : width / 2;
                                    body.plugin.fakeTargetX = poolCenterX;
                                    body.plugin.fakeTargetY = height - 150; // Paraşüt bırakma noktası

                                    // Rastgele geliş açısı seç (15 ile 50 derece arası). 75 derece çok uçuk hızlara sebep oluyordu.
                                    let sign = Math.random() < 0.5 ? 1 : -1;
                                    let angleDeg = Math.random() * 35 + 15;
                                    let angleRad = (angleDeg * Math.PI) / 180 * sign;

                                    let dy = body.plugin.fakeTargetY - (-50); // Toplam dikey yol
                                    let totalDx = Math.tan(angleRad) * dy; // Toplam yatay yol

                                    // Unfolded (katlanmamış) başlangıç X noktası
                                    let unfoldedStartX = poolCenterX - totalDx;

                                    body.plugin.fakeUnfoldedStartX = unfoldedStartX;
                                    body.plugin.fakeTargetUnfoldedX = poolCenterX;
                                    body.plugin.fakeStartY = -50;

                                    // Gerçek (katlanmış) başlangıç noktasını bul ve karakteri oraya ışınla
                                    let wallLeft = 50;
                                    let wallRight = width - 50;
                                    let innerWidth = wallRight - wallLeft;
                                    let period = innerWidth * 2;
                                    let normalizedUnfolded = unfoldedStartX - wallLeft;
                                    let mod = ((normalizedUnfolded % period) + period) % period;
                                    let actualStartX = wallLeft + (mod > innerWidth ? period - mod : mod);

                                    Matter.Body.setPosition(body, { x: actualStartX, y: -50 });

                                    // İlk sallantıyı engellemek için başlangıç X hızını anında hedef hıza eşitleyelim
                                    let initialBaseVx = ((poolCenterX - unfoldedStartX) / dy) * body.velocity.y;
                                    let initialTargetVx = mod > innerWidth ? -initialBaseVx : initialBaseVx;
                                    Matter.Body.setVelocity(body, { x: initialTargetVx, y: body.velocity.y });
                                }

                                // İdeal diagonal X noktası (katlanmış uzayda)
                                let progress = (body.position.y - body.plugin.fakeStartY) / (body.plugin.fakeTargetY - body.plugin.fakeStartY);
                                progress = Math.max(0, Math.min(1, progress));

                                let currentUnfoldedX = body.plugin.fakeUnfoldedStartX + (body.plugin.fakeTargetUnfoldedX - body.plugin.fakeUnfoldedStartX) * progress;

                                // Karakter yarıçapı sınırlarında katlama (Duvarlara sürtünmeyi tamamen önler!)
                                let wallLeft = 50;
                                let wallRight = width - 50;
                                let innerWidth = wallRight - wallLeft;
                                let period = innerWidth * 2;
                                let normalizedUnfolded = currentUnfoldedX - wallLeft;
                                let mod = ((normalizedUnfolded % period) + period) % period;
                                let idealX = wallLeft + (mod > innerWidth ? period - mod : mod);

                                // İdeal yolda ilerlemesi için gereken temel X hızı
                                let baseVx = ((body.plugin.fakeTargetUnfoldedX - body.plugin.fakeUnfoldedStartX) / (body.plugin.fakeTargetY - body.plugin.fakeStartY)) * body.velocity.y;

                                // Serbest düşüşteyken (paraşüt açılmadan önce) mermi gibi sağa/sola fırlamasını engellemek için hız sınırı
                                baseVx = Math.max(-22, Math.min(22, baseVx));
                                let targetVx = mod > innerWidth ? -baseVx : baseVx;

                                // İdeal yoldan sapmaları düzeltmek için esnek ve yumuşak bir kuvvet (PD Kontrolcü)
                                // Rigid setVelocity yerine applyForce kullanıyoruz ki doğal paraşüt salınımları (sway) ile savaşmasın, titreme (türbülans) yapmasın.
                                let dx = idealX - body.position.x;
                                let dv = targetVx - body.velocity.x;
                                let forceX = (dx * 0.0002 + dv * 0.005) * body.mass;
                                Matter.Body.applyForce(body, body.position, { x: forceX, y: 0 });

                                // Tam inerken (Yükseklik kontrolü: Havuzun hemen üstü)
                                if (body.position.y > height - 150) {
                                    body.plugin.fakeJetpackActivated = true;

                                    // Paraşütü anında bırak
                                    body.plugin.parachuteOpened = false;
                                    body.plugin.parachuteOpening = false;
                                    body.plugin.parachuteClosing = false;
                                    if (body.render.sprite) {
                                        delete body.render.sprite.texture;
                                    }

                                    body.plugin.hasJetpack = true;

                                    // Jetpack X yönünde rastgele hız (örneğin 3 ile 7 arası)
                                    let sign = Math.random() < 0.5 ? -1 : 1;
                                    body.plugin.jetpackVelocityX = sign * (Math.random() * 4 + 3);
                                    // Jetpack Y yönünde rastgele hız (örneğin -10 ile -15 arası)
                                    body.plugin.jetpackVelocityY = -(Math.random() * 5 + 10);

                                    body.collisionFilter = {
                                        group: body.collisionFilter.group || 0,
                                        category: body.collisionFilter.category,
                                        mask: 0
                                    };
                                    continue; // Prevent parachute re-opening in the frame jetpack activates
                                }
                            } else {
                                // Jetpack devrede: Havaya ve rastgele bir açıyla uçuş
                                Matter.Body.setVelocity(body, { x: body.plugin.jetpackVelocityX, y: body.plugin.jetpackVelocityY });

                                // Karakterin açısını hızına (uçuş yönüne) göre orantılı olarak belirle
                                let targetAngle = body.plugin.jetpackVelocityX * 0.04;
                                Matter.Body.setAngle(body, targetAngle);
                                Matter.Body.setAngularVelocity(body, 0);

                                // Ekrandan çıkınca temizle
                                if (body.position.y < -150 || body.position.x < -100 || body.position.x > width + 100) {
                                    Matter.Composite.remove(world, body);
                                    if (body.plugin.domElement) {
                                        body.plugin.domElement.remove();
                                    }
                                }
                                continue;
                            }
                        }
                    }

                    // --- TARZAN MODU İÇİN ÖZEL DAVRANIŞ ---
                    if (body.plugin.isTarzan) {
                        if (!body.plugin.landed) {
                            if (!body.plugin.tarzanReleased) {
                                Matter.Body.setAngularVelocity(body, 0);
                                Matter.Body.setAngle(body, 0);
                            } else {
                                // Dönmeyi biraz gecikmeli başlat
                                if (engine.timing.timestamp > body.plugin.tarzanReleaseTimer + 300) {
                                    // 1 tur takla atıp geri doğrulma
                                    if (body.plugin.flipAngle === undefined) {
                                        body.plugin.flipAngle = 0;
                                        // Dönüş hızı bir tık artırıldı (0.05 -> 0.08)
                                        body.plugin.flipSpeed = body.plugin.tarzanFromLeft ? -0.08 : 0.08;
                                    }

                                    if (Math.abs(body.plugin.flipAngle) < Math.PI * 2) {
                                        body.plugin.flipAngle += body.plugin.flipSpeed;
                                        Matter.Body.setAngle(body, body.plugin.flipAngle);
                                        Matter.Body.setAngularVelocity(body, 0);
                                    } else {
                                        Matter.Body.setAngle(body, 0);
                                        Matter.Body.setAngularVelocity(body, 0);
                                    }
                                } else {
                                    Matter.Body.setAngularVelocity(body, 0);
                                    Matter.Body.setAngle(body, 0);
                                }
                            }

                            // Timer dolduysa ve henüz ip kopmadıysa kopar
                            if (!body.plugin.tarzanReleased && engine.timing.timestamp > body.plugin.tarzanReleaseTimer) {
                                body.plugin.tarzanReleased = true;

                                // Kuvvetleri sıfırlamıyoruz, yatay olarak fırlamaya devam edecek.
                                // İpin salınıma 1 saniye daha devam edip sonra fade olarak kaybolması için:
                                if (body.plugin.tarzanConstraint) {
                                    // İpin ucuna karakterin yerine görünmez, hafif bir ağırlık takıyoruz
                                    const dummyWeight = Matter.Bodies.circle(body.position.x, body.position.y, 5, {
                                        collisionFilter: { group: Matter.Body.nextGroup(true) },
                                        render: { visible: false },
                                        density: 0.01 // İpin düzgün sallanması için küçük bir ağırlık
                                    });
                                    Matter.Body.setVelocity(dummyWeight, { x: body.velocity.x, y: body.velocity.y });
                                    Matter.Composite.add(world, dummyWeight);

                                    // Constraint'i (ipi) karaktere değil, bu ağırlığa bağlıyoruz
                                    body.plugin.tarzanConstraint.bodyB = dummyWeight;

                                    // 1 saniye sonra ipi kaybolmaya (fade) başlat
                                    setTimeout(() => {
                                        let fadeOpacity = 1;
                                        let fadeInterval = setInterval(() => {
                                            fadeOpacity -= 0.1;
                                            if (fadeOpacity <= 0) {
                                                clearInterval(fadeInterval);
                                                Matter.Composite.remove(world, dummyWeight);
                                                if (body.plugin.tarzanConstraint) {
                                                    Matter.Composite.remove(world, body.plugin.tarzanConstraint);
                                                }
                                            } else {
                                                if (body.plugin.tarzanConstraint && body.plugin.tarzanConstraint.render) {
                                                    // Rengi transparan yap (fade out)
                                                    body.plugin.tarzanConstraint.render.strokeStyle = `rgba(139, 69, 19, ${fadeOpacity})`;
                                                }
                                            }
                                        }, 50);
                                    }, 1000);
                                }
                            }
                        }

                        continue;
                    }

                    if (body.plugin.landed) {
                        // Topun görünürlüğünü yavaş yavaş %75'e düşür (tak diye inmesin)
                        if (body.plugin.ballOpacity === undefined) body.plugin.ballOpacity = 1;
                        if (body.plugin.ballOpacity > 0.75) {
                            body.plugin.ballOpacity -= 0.01;
                            if (body.plugin.ballOpacity < 0.75) body.plugin.ballOpacity = 0.75;
                        }

                        // Yere indikten sonra paraşütü aşağı kaydırarak ve şeffaflaştırarak (fade) yok et
                        // Eğer paraşüt objesi aktifse yok olma animasyonunu yap
                        if (body.render.sprite && body.render.sprite.texture) {
                            body.render.sprite.yOffset -= 0.03;

                            // Opacity (şeffaflık) azalt
                            if (body.render.opacity === undefined) body.render.opacity = 1;
                            body.render.opacity -= 0.05; // Hızlıca kaybolması için

                            if (body.render.sprite.yOffset < -1.0 || body.render.opacity <= 0) {
                                body.plugin.parachuteOpened = false; // Paraşüt tamamen kapandı
                                // Paraşüt silinince sadece resmi biz çizmeye devam edeceğiz
                                delete body.render.sprite.texture;
                                body.render.sprite.yOffset = 0;
                                body.render.opacity = body.plugin.ballOpacity;
                            }
                        } else {
                            // Paraşüt zaten silinmişse opacity'yi güncelliyoruz
                            body.render.opacity = body.plugin.ballOpacity;
                        }
                    } else if (!body.plugin.parachuteOpened) {
                        if (body.plugin.isDrunk) {
                            if (!body.plugin.drunkTimerFreefall || engine.timing.timestamp > body.plugin.drunkTimerFreefall) {
                                body.plugin.drunkTimerFreefall = engine.timing.timestamp + 800 + Math.random() * 800;
                                const randomSpeedX = (Math.random() - 0.5) * 40;
                                Matter.Body.setVelocity(body, { x: randomSpeedX, y: body.velocity.y });
                            }

                            if (!body.plugin.drunkJerkTimerFreefall || engine.timing.timestamp > body.plugin.drunkJerkTimerFreefall) {
                                body.plugin.drunkJerkTimerFreefall = engine.timing.timestamp + 200 + Math.random() * 300;
                                const jerkX = (Math.random() - 0.5) * 20;
                                Matter.Body.setVelocity(body, { x: body.velocity.x * 0.7 + jerkX, y: body.velocity.y });
                            }

                            // Dalgalı hareket kuvveti (titrek düşüş)
                            let time = engine.timing.timestamp * 0.0015;
                            let wavyForceX = Math.sin(time * 10 + body.id) * 0.0003 * body.mass;
                            Matter.Body.applyForce(body, body.position, { x: wavyForceX, y: 0 });

                            // Daha az sürtünme ile uzun savrulmalar
                            Matter.Body.setVelocity(body, { x: body.velocity.x * 0.995, y: body.velocity.y });
                        }
                        // Çarpışma sonrası bekleme (cooldown) süresini kontrol et
                        let canOpen = true;
                        if (body.plugin.parachuteCooldown && engine.timing.timestamp < body.plugin.parachuteCooldown) {
                            canOpen = false;
                        }

                        // Obje ekranın üst 1/4'ünü geçti mi ve açılmaya hazır mı?
                        if (canOpen && body.position.y > height / 4) {
                            body.plugin.parachuteOpened = true;
                            body.plugin.parachuteOpening = true; // Açılış animasyonunu başlat

                            // Kullanıcının panelden seçtiği aktif paraşütler arasından rastgele birini seç
                            let targetScale = 1.0;

                            if (isBirthdayMode) {
                                body.render.sprite.texture = 'party/partybaloons.png';
                                targetScale = 0.43; // 0.36'dan 1.2x daha büyütüldü
                            } else {
                                const listToUse = activeParachutes.length > 0 ? activeParachutes : [11];
                                const parasutNo = listToUse[Math.floor(Math.random() * listToUse.length)];
                                body.render.sprite.texture = `parasut${parasutNo}.png`;
                                targetScale = parasutNo >= 15 ? 0.15 : 1.0;
                            }

                            body.render.sprite.yOffset = 0.8; // Paraşütü karakterin üstüne taşır

                            if (isSmallPool) targetScale *= 0.60;
                            body.plugin.targetParachuteScale = targetScale;

                            body.render.sprite.xScale = 0.02; // Animasyon için küçük başla
                            body.render.sprite.yScale = 0.02;
                            body.render.opacity = 0; // Transparan başla
                        }
                    } else {
                        // PARAŞÜT AÇIK DURUMU: (Açılıyor, Kapanıyor veya Tam Açık)

                        // 1. Paraşüt Salınım (Sarkaç) Hareketi: Açılırken/kapanırken de doğal salınsın
                        // Salınım hızını azaltmak için zaman çarpanı 0.003'ten 0.0015'e düşürüldü
                        let time = engine.timing.timestamp * 0.0015;
                        let swayAngle = Math.sin(time + body.id) * 0.15;
                        let swayForce = Math.sin(time + body.id) * 0.00002 * body.mass;

                        if (body.plugin.isDrunk) {
                            // Salınımı daha yavaş ve sakin yapıyoruz
                            swayAngle = Math.sin(time * 0.8 + body.id) * 0.2;
                            // Dalgalı (wavy) hareket için sürekli sarsıntılı bir kuvvet
                            swayForce = Math.sin(time * 12 + body.id) * 0.00015 * body.mass;

                            if (!body.plugin.drunkTimer || engine.timing.timestamp > body.plugin.drunkTimer) {
                                // 1.2s - 2.5s arası ana yön belirle (daha uzun süre bir yöne gitsin)
                                body.plugin.drunkTimer = engine.timing.timestamp + 1200 + Math.random() * 1300;

                                // Çok daha abartılı sağ-sol savrulması (-25 ile +25 arası hızlar)
                                const randomSpeedX = (Math.random() - 0.5) * (Math.random() * 40 + 10);

                                // Dikey hızda ani yavaşlamalar veya hafif hızlı düşüşler (0 - 2.5)
                                const randomSpeedY = Math.random() * 2.5;

                                Matter.Body.setVelocity(body, { x: randomSpeedX, y: randomSpeedY });
                            }

                            if (!body.plugin.drunkJerkTimer || engine.timing.timestamp > body.plugin.drunkJerkTimer) {
                                // 0.2s - 0.5s arası küçük zikzak (sağa giderken küçük sol yapıp sağa devam etme vb)
                                body.plugin.drunkJerkTimer = engine.timing.timestamp + 200 + Math.random() * 300;

                                // Ana hızı biraz koruyarak üzerine zıt veya aynı yönde ufak sapmalar ekle
                                const jerkX = (Math.random() - 0.5) * 15;
                                Matter.Body.setVelocity(body, { x: body.velocity.x * 0.75 + jerkX, y: body.velocity.y });
                            }

                            // Sürtünmeyi azalttım, momentumunu daha uzun süre korusun (0.99 -> 0.995)
                            Matter.Body.setVelocity(body, { x: body.velocity.x * 0.995, y: body.velocity.y });
                        }

                        Matter.Body.setAngle(body, swayAngle);
                        Matter.Body.applyForce(body, body.position, { x: swayForce, y: 0 });

                        // 2. Duruma Özel İşlemler
                        const maxScale = body.plugin.targetParachuteScale || 1.0;
                        if (body.plugin.parachuteClosing) {
                            // Çarpışma Sonrası Kapanma Animasyonu (Hızlandırıldı)
                            if (body.render.sprite && body.render.sprite.texture) {
                                body.render.sprite.xScale -= (0.15 * maxScale);
                                body.render.sprite.yScale -= (0.15 * maxScale);
                                body.render.opacity -= 0.2;

                                if (body.render.sprite.xScale <= (0.1 * maxScale) || body.render.opacity <= 0) {
                                    body.plugin.parachuteClosing = false;
                                    body.plugin.parachuteOpened = false;
                                    delete body.render.sprite.texture;
                                    body.render.sprite.yOffset = 0;
                                    body.render.opacity = 1;
                                    body.plugin.parachuteCooldown = engine.timing.timestamp + 300;
                                }
                            }
                        } else if (body.plugin.parachuteOpening) {
                            // İlk Açılma Animasyonu (Hızlandırıldı - Daha anında patlar)
                            if (body.render.sprite && body.render.sprite.texture) {
                                body.render.sprite.xScale += (0.3 * maxScale);
                                body.render.sprite.yScale += (0.3 * maxScale);
                                body.render.opacity += 0.3;

                                if (body.velocity.y > 1.5) Matter.Body.setVelocity(body, { x: body.velocity.x, y: 1.5 });

                                if (body.render.sprite.xScale >= maxScale) {
                                    body.render.sprite.xScale = maxScale;
                                    body.render.sprite.yScale = maxScale;
                                    body.render.opacity = 1;
                                    body.plugin.parachuteOpening = false;
                                }
                            }
                        } else {
                            // NORMAL AÇIK DURUM
                            // Sarhoş ise dikey hız sınırı biraz daha esnek olsun (1.5 yerine 2.5'a kadar izin ver)
                            const maxSpeedY = body.plugin.isDrunk ? 2.5 : 1.5;
                            if (body.velocity.y > maxSpeedY) {
                                Matter.Body.setVelocity(body, { x: body.velocity.x, y: maxSpeedY });
                            }
                        } // closes inner else
                    } // closes outer else
                } // closes if(body.label === 'karakter')
            } // closes for loop
        });

        // --- 6. ÇARPIŞMA (PUANLAMA VE SİLME) ---
        let currentKing = null; // Havuzdaki mevcut lider
        // Kral silinme zamanlayıcısı kaldırıldı (overlay açık olduğu sürece silinmeyecek)

        // Her fizik adımından önce yatay hızı kaydet; duvar sekmesinde gelen hızı kullanılır
        Events.on(engine, 'beforeUpdate', function () {
            const all = Composite.allBodies(world);
            for (let k = 0; k < all.length; k++) {
                if (all[k].label === 'karakter' && all[k].plugin) all[k].plugin.preStepVx = all[k].velocity.x;
            }
        });
        // Solver bittikten sonra duvar sekmesini kayıtsız uygula
        Events.on(engine, 'afterUpdate', function () {
            const all = Composite.allBodies(world);
            for (let k = 0; k < all.length; k++) {
                const b = all[k];
                if (b.label === 'karakter' && b.plugin && b.plugin.wallBounceVx !== undefined) {
                    if (!b.isStatic) Matter.Body.setVelocity(b, { x: b.plugin.wallBounceVx, y: b.velocity.y });
                    b.plugin.wallBounceVx = undefined;
                }
            }
        });

        Events.on(engine, 'collisionStart', function (event) {
            const pairs = event.pairs;

            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                // Kenar duvarları: yatay hız birebir aynı büyüklükte ters çevrilir (afterUpdate'te uygulanır)
                {
                    let wallHit = null, wallChar = null;
                    if ((bodyA === leftWall || bodyA === rightWall) && bodyB.label === 'karakter') { wallHit = bodyA; wallChar = bodyB; }
                    else if ((bodyB === leftWall || bodyB === rightWall) && bodyA.label === 'karakter') { wallHit = bodyB; wallChar = bodyA; }
                    if (wallHit && wallChar && !wallChar.isStatic && wallChar.plugin) {
                        const speed = Math.abs(wallChar.plugin.preStepVx !== undefined ? wallChar.plugin.preStepVx : wallChar.velocity.x);
                        if (speed > 0.01) wallChar.plugin.wallBounceVx = (wallHit === leftWall ? 1 : -1) * speed;
                    }
                }

                let characterBody = null;
                let groundBody = null;

                // Hangi objenin havuz/zemin, hangisinin karakter olduğunu tespit et
                let isTarget = (bodyA.label === 'hedefZemin' || bodyA.label === 'zemin') && bodyB.label === 'karakter';
                let isTargetReverse = (bodyB.label === 'hedefZemin' || bodyB.label === 'zemin') && bodyA.label === 'karakter';

                if (isTarget) {
                    groundBody = bodyA;
                    characterBody = bodyB;
                } else if (isTargetReverse) {
                    groundBody = bodyB;
                    characterBody = bodyA;
                }

                // --- İKİ KARAKTER HAVADA ÇARPIŞIRSA ---
                if (bodyA.label === 'karakter' && bodyB.label === 'karakter') {
                    if (!bodyA.plugin.landed && !bodyB.plugin.landed) {
                        // Sadece paraşütü açık olanları (veya açılmakta olanları) kapatma animasyonuna sok
                        if (bodyA.plugin.parachuteOpened) bodyA.plugin.parachuteClosing = true;
                        if (bodyB.plugin.parachuteOpened) bodyB.plugin.parachuteClosing = true;

                        // Çarpışma hafif olsun: hızları yumuşakça sınırla
                        const clampV = (v) => Math.max(-2.5, Math.min(2.5, v));
                        const dirX = bodyA.position.x >= bodyB.position.x ? 1 : -1;
                        Matter.Body.setVelocity(bodyA, { x: clampV(bodyA.velocity.x * 0.3 + dirX * 1.5), y: -1.5 });
                        Matter.Body.setVelocity(bodyB, { x: clampV(bodyB.velocity.x * 0.3 - dirX * 1.5), y: -1.5 });
                    }
                }

                // Havuz veya zemin ile bir karakter çarpıştıysa ve daha önce kilitlenmediyse:
                if (characterBody && groundBody && !characterBody.plugin.landed) {
                    characterBody.plugin.landed = true;
                    // Paraşütü anında silmiyoruz; beforeUpdate içinde yavaşça aşağı kaydırılacak.

                    // Karakteri çarptığı yere anında kilitle (zıplama veya kayma olmasın)
                    Matter.Body.setStatic(characterBody, true);
                    Matter.Body.setAngle(characterBody, 0); // Yere düştüğünde dümdüz dik dursun

                    // Yere düşen karakteri 'hayalet' (sensor) yap ki yeni düşenler ona çarpıp sekmesin, içinden geçsin
                    characterBody.isSensor = true;

                    // Puan hesaplama (sadece havuza düştüyse puan ver, zemine düştüyse puan yok)
                    let finalScore = null; // Havuzu tutturamayanlar veya lideri geçemeyenler için null
                    let waitTime = 3000; // Dışarı düşenler 3sn bekler

                    if (groundBody.label === 'hedefZemin') {
                        const centerX = groundBody.position.x; // Havuzun anlık X konumu (rastgele spawn olduğu yer)
                        const charX = characterBody.position.x;
                        const distance = Math.abs(centerX - charX);
                        const maxDistance = poolHitboxRadiusX; // 315'ten 155'e düşürüldü (görsel havuz yarıçapı ile birebir eşitlendi)

                        let rawScore = 100 * (1 - (distance / maxDistance));
                        let clampedScore = Math.max(1, Math.min(100, rawScore));
                        let calculatedScore = parseFloat(clampedScore.toFixed(2));

                        // Havuza düşen herkesin skorunu sağdaki "Atla Sıralaması" tablosuna ekle/güncelle
                        updateLeaderboard(characterBody.plugin.username, calculatedScore);
                        addDropPoolLog(characterBody.plugin.username, 'PUAN', `${calculatedScore} puan aldı (Havuza indi).`);
                        updateDropPoolStats(characterBody.plugin.username, 'SCORE', calculatedScore);

                        // --- 95-98 ARASI İÇİN KONFETİ (Effect 3 - Geliştirilmiş) ---
                        if (calculatedScore >= 95 && calculatedScore < 99 && typeof confetti === 'function') {
                            // Sağdan ve soldan daha uzağa (startVelocity: 80) fırlayan stadyum topu
                            const cannons = { particleCount: 100, spread: 55, startVelocity: 80, zIndex: 9999, colors: ['#FFD700', '#FF69B4', '#00FFFF', '#32CD32', '#FF4500'] };
                            confetti({ ...cannons, angle: 60, origin: { x: 0, y: 1 } });
                            confetti({ ...cannons, angle: 120, origin: { x: 1, y: 1 } });
                        }

                        // --- 99 ÜSTÜ EFSANEVİ ATLAYIŞ İÇİN ÖZEL EFEKT ---
                        if (calculatedScore >= 99 && typeof confetti === 'function') {
                            // 1. Ekranın tam ortasında devasa "Altın ve Beyaz" yıldız patlaması
                            confetti({
                                particleCount: 200,
                                spread: 160,
                                startVelocity: 60,
                                origin: { x: 0.5, y: 0.5 },
                                colors: ['#FFD700', '#FFFFFF', '#FFA500'],
                                shapes: ['star'],
                                ticks: 350, // Şelalenin bitişiyle aynı ana denk gelmesi (senkron) için ömrü uzatıldı
                                zIndex: 9999
                            });

                            // 2. Ardından 2 saniye boyunca altın şelalesi (Festival Yağmuru)
                            const duration = 2000;
                            const end = Date.now() + duration;
                            (function frame() {
                                confetti({
                                    particleCount: 5,
                                    angle: -60,
                                    spread: 55,
                                    origin: { x: 0, y: 0 },
                                    colors: ['#FFD700', '#FFFFFF'],
                                    zIndex: 9999
                                });
                                confetti({
                                    particleCount: 5,
                                    angle: -120,
                                    spread: 55,
                                    origin: { x: 1, y: 0 },
                                    colors: ['#FFD700', '#FFFFFF'],
                                    zIndex: 9999
                                });
                                if (Date.now() < end) {
                                    requestAnimationFrame(frame);
                                }
                            }());
                        }

                        // Kral Mekaniği (Mevcut kralın puanını al, yoksa -1 say)
                        let currentKingScore = (currentKing && currentKing.plugin && currentKing.plugin.score) ? parseFloat(currentKing.plugin.score) : -1;

                        if (calculatedScore > currentKingScore) {
                            // YENİ KRAL! (Veya havuz boş)
                            finalScore = clampedScore.toFixed(2);
                            waitTime = 30000; // Kral 30 saniye bekleyecek

                            // --- YENİ LİDER KONFETİSİ (Effect 2) ---
                            // Sadece mesafesi biraz azaltılmış (startVelocity: 35) havuzdan fışkırma
                            if (typeof confetti === 'function') {
                                let poolX = 0.5;
                                if (typeof pool !== 'undefined' && pool) poolX = pool.position.x / window.innerWidth;
                                confetti({
                                    particleCount: 120,
                                    spread: 60,
                                    startVelocity: 35, // Daha da azaltıldı (eski 45'ti)
                                    origin: { x: poolX, y: 1 },
                                    colors: ['#FFD700', '#FF69B4', '#00FFFF', '#32CD32', '#FF4500'],
                                    zIndex: 9999
                                });
                            }

                            // Eğer içeride eski bir kral varsa süresini beklemeden hemen sil
                            if (currentKing) {
                                if (currentKing.plugin.removeTimer) clearTimeout(currentKing.plugin.removeTimer);
                                Composite.remove(world, currentKing);
                            }

                            currentKing = characterBody; // Yeni kral artık bu kişi


                            // Kralın süresi: 30 saniye sonra gidecek
                            characterBody.plugin.removeTimer = setTimeout(() => {
                                Composite.remove(world, characterBody);
                                if (currentKing === characterBody) {
                                    currentKing = null;
                                }
                            }, waitTime);

                        } else {
                            // KRALI GEÇEMEDİ! Havuzun içine düştü ama lider olamadı. 
                            // Havuza düşenlerin süresi 6 saniye.
                            finalScore = null;
                            waitTime = 6000;

                            setTimeout(() => {
                                Composite.remove(world, characterBody);
                            }, waitTime);
                        }
                    } else {
                        // ZEMİNE (HAVUZ DIŞINA) DÜŞENLER
                        addDropPoolLog(characterBody.plugin.username, 'PUAN', `Havuzu ıskaladı (Dışarı düştü).`);
                        setTimeout(() => {
                            Composite.remove(world, characterBody);
                        }, waitTime);
                    }

                    // Puanı eklentinin (plugin) içerisine kaydedelim
                    characterBody.plugin.score = finalScore;

                    if (finalScore !== null) {
                        console.log(`[${characterBody.plugin.username}] YENİ LİDER! PUAN: ${finalScore} - Havuzda Kalma Süresi: ${waitTime / 1000}sn`);
                    } else {
                        console.log(`[${characterBody.plugin.username}] havuza düştü ama Lideri geçemedi (veya dışarı düştü). 3sn sonra silinecek.`);
                    }
                }
            }
        });

        // --- 7. KULLANICI İSİMLERİ VE PUANLARI ÇİZİMİ ---
        const trailParticles = [];
        const trailColors = ['#FFD700', '#FF69B4', '#00FFFF', '#32CD32', '#FF4500']; // Altın, Pembe, Cam Göbeği, Yeşil, Turuncu

        // Her karede canvas durumunu sıfırla: önceki karede çizim sırasında bir hata olsa bile
        // dönüşüm (translate/rotate/alpha) kayması kalıcı olmasın (havuz/karakter kaybolmasını önler).
        Events.on(render, 'beforeRender', function () {
            const ctx = render.context;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        });

        Events.on(render, 'afterRender', function () {
            const context = render.context;
            const bodies = Composite.allBodies(world);

            // Havuzun merkezindeki su yüzeyine belirgin transparan "CrossWeq" yazısı
            // Sadece doğum günü (party) modu DEĞİLSE görünsün
            if (typeof pool !== 'undefined' && pool && !isBirthdayMode) {
                context.save();
                context.textAlign = 'center';
