                context.textBaseline = 'middle';
                // Daha belirgin ve okunaklı yarı saydam filigran
                context.font = '700 22px "Outfit", sans-serif';
                context.lineWidth = 2;

                const watermarkX = pool.position.x;
                const watermarkY = pool.position.y - 14;

                context.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                context.strokeText("CrossWeq", watermarkX, watermarkY);

                context.fillStyle = 'rgba(0, 0, 0, 0.6)';
                context.fillText("CrossWeq", watermarkX, watermarkY);

                context.restore();
            }

            // --- PARTİ IŞILTILI KUYRUK ÇİZİMİ ---
            if (showTrail) {
                context.save();
                context.shadowBlur = 5; // Parçacıklara (Glow) parlama efekti

                for (let i = trailParticles.length - 1; i >= 0; i--) {
                    let p = trailParticles[i];
                    p.life -= p.decay || 0.0215; // Meteorlar için özel decay varsa onu kullan
                    p.x += p.vx;
                    p.y += p.vy;

                    // Ömrü biten parçacığı listeden temizle
                    if (p.life <= 0) {
                        trailParticles.splice(i, 1);
                        continue;
                    }

                    // Şeffaflığı ve renkleri ayarla
                    context.globalAlpha = p.life;
                    context.fillStyle = p.color;
                    context.shadowColor = p.color; // Kendi renginde parlasın

                    // Parçacığı (yuvarlak yıldız) çiz
                    context.beginPath();
                    context.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
                    context.fill();
                }
                context.restore();
            }

            context.textAlign = 'center';

            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];
                if (body.label === 'karakter' && body.plugin && body.plugin.username) {

                    // --- PARTİ IŞILTILI KUYRUK ÜRETİMİ ---
                    if (showTrail && !body.plugin.landed) {
                        if (body.plugin.isMeteor) {
                            // Alev efektli, daha yoğun ve kırmızı tonlarda kuyruk
                            for (let m = 0; m < 2; m++) {
                                trailParticles.push({
                                    x: body.position.x + (Math.random() - 0.5) * (body.circleRadius * 1.5),
                                    y: body.position.y - 10,
                                    vx: (Math.random() - 0.5) * 2,
                                    vy: Math.random() * -3 - 1,
                                    life: 1,
                                    decay: 0.066, // Yavaşlama sonrası kuyruğu %10 daha kısaltmak için ayarlandı
                                    size: Math.random() * 5 + 3,
                                    // %80 Kırmızı, %16 Turuncu, %4 Sarı
                                    color: Math.random() > 0.2 ? '#ff1a00' : (Math.random() > 0.2 ? '#ff6600' : '#ffcc00')
                                });
                            }
                        } else if (Math.random() < 0.4) {
                            // Havada düşerken her karede %40 şansla normal meteor izi / parti ışıltısı üret
                            trailParticles.push({
                                x: body.position.x + (Math.random() - 0.5) * 30, // Karakter genişliğinde rastgele X
                                y: body.position.y - 15, // Karakterin hemen arka/üst kısmından çıksın
                                vx: (Math.random() - 0.5) * 1.5, // Hafif sağa sola saçılma
                                vy: Math.random() * -1.5 - 0.5,  // Yukarıya (geriye) doğru uçuşma
                                life: 1, // Yaşam süresi (Şeffaflık)
                                size: Math.random() * 3 + 1.5, // Parçacık boyutu
                                color: trailColors[Math.floor(Math.random() * trailColors.length)]
                            });
                        }
                    }

                    // Karakterleri her zaman manuel olarak çiziyoruz, böylece paraşüt açıldığında veya yere değdiğinde asla yok olmuyorlar.
                    context.save();
                    try {
                        // Karakterin kendi şeffaflığını (ballOpacity) kullan (Paraşütün silinme animasyonu karaktere yansımasın)
                        const opacity = body.plugin.ballOpacity !== undefined ? body.plugin.ballOpacity : 1;
                        context.globalAlpha = opacity;

                        // Jetpack'i karakterden önce (arkasına) çiz
                        if (body.plugin.hasJetpack) {
                            let jetpackImg = charImagesMap['jetback.png'];
                            if (jetpackImg && jetpackImg.complete && jetpackImg.naturalWidth > 0) {
                                let jpScale = isSmallPool ? 0.045 : 0.075; // 0.075 * 0.60
                                let jpWidth = jetpackImg.width * jpScale;
                                let jpHeight = jetpackImg.height * jpScale;
                                context.translate(body.position.x, body.position.y);
                                context.rotate(body.angle);
                                context.drawImage(jetpackImg, -jpWidth / 2, -jpHeight / 2 + 35, jpWidth, jpHeight); // +25'ten +35'e indirdik (daha aşağıda)
                                context.rotate(-body.angle);
                                context.translate(-body.position.x, -body.position.y);
                            }
                        }

                        if (body.plugin.isCustom && body.plugin.domElement) {
                            // DOM elementini güncelle (Animasyonlu GIF/WEBP desteği)
                            const el = body.plugin.domElement;
                            el.style.left = body.position.x + 'px';
                            el.style.top = (body.position.y + (body.plugin.charYOffset || 0)) + 'px';
                            el.style.transform = `translate(-50%, -50%) rotate(${body.angle}rad)`;
                            el.style.opacity = opacity;
                        } else if (body.plugin.charTexture) {
                            let img = charImagesMap[body.plugin.charTexture];
                            if (img && img.complete && img.naturalWidth > 0) {
                                let drawWidth = img.width * body.plugin.charScale;
                                let drawHeight = img.height * body.plugin.charScale;
                                context.translate(body.position.x, body.position.y + (body.plugin.charYOffset || 0));
                                context.rotate(body.angle);
                                context.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                            }
                        }
                    } catch (drawErr) {
                        console.error('Karakter çizim hatası:', drawErr);
                    } finally {
                        context.restore();
                    }

                    // Lider (Kral) kontrolü
                    const isLeader = (body === currentKing);

                    // Kullanıcı Adını Yazdır
                    const fontSize = isLeader ? (isSmallPool ? 14 : 23) : (isSmallPool ? 11 : 18); // Boyutlar %60 oranında
                    // Karakter boyutları farklı olduğu için ismin yüksekliğini görselin tepesine (visual radius) göre dinamik belirliyoruz
                    const visualRadius = (body.circleRadius || 30) - (body.plugin.charYOffset || 0);
                    const nameOffsetY = (isLeader ? (visualRadius + (isSmallPool ? 17 : 28)) : (visualRadius + (isSmallPool ? 11 : 18))) + (body.plugin.nameYOffset || 0); // Özel karakter offset'i varsa ekle

                    context.font = `600 ${fontSize}px "Outfit", sans-serif`;
                    context.textAlign = "center"; // Puan ile karakter isminin hizada (ortalı) durması için
                    context.fillStyle = 'white';
                    context.shadowColor = 'rgba(0, 0, 0, 0.6)';
                    context.shadowBlur = 3;
                    context.lineWidth = isSmallPool ? 1.2 : 2; // Çizgi kalınlığı orantılı

                    // Etrafına ince siyah kontur çiz
                    context.strokeText(body.plugin.username, body.position.x, body.position.y - nameOffsetY);
                    // İçini beyaz doldur
                    context.fillText(body.plugin.username, body.position.x, body.position.y - nameOffsetY);

                    // Eğer yere düşmüş ve puanı belli olmuşsa (null değilse) puanını da yazdır
                    if (body.plugin.score !== undefined && body.plugin.score !== null) {
                        const scoreFontSize = isSmallPool ? 14 : 23;
                        context.font = `700 ${scoreFontSize}px "Outfit", sans-serif`; // Daha zarif ve modern
                        context.lineWidth = isSmallPool ? 1.2 : 2;

                        const numScore = parseFloat(body.plugin.score);
                        // Renk Kuralları:
                        // 90 altı: Yeşil
                        // 90 - 95: Sarı
                        // 95 - 100: Kırmızı
                        if (numScore < 90) {
                            context.fillStyle = '#22c55e'; // Canlı Yeşil
                        } else if (numScore <= 95) {
                            context.fillStyle = '#facc15'; // Altın Sarısı
                        } else {
                            context.fillStyle = '#ef4444'; // Ateş Kırmızısı
                        }

                        let scoreText = body.plugin.score;
                        // Sadece 95 puan ve üzerine yıldız ekle
                        if (numScore >= 95) {
                            scoreText = `${scoreText} ⭐`;
                        }

                        // Puan boyutu 27px olduğu için ismin üzerine taşmasın diye aralığı orantılayarak (24px) taşıdık
                        const scoreOffsetY = nameOffsetY + (isSmallPool ? 24 : 40);

                        context.strokeText(scoreText, body.position.x, body.position.y - scoreOffsetY);
                        context.fillText(scoreText, body.position.x, body.position.y - scoreOffsetY);
                    }

                    // Gölgeleri kapat (diğer çizimleri etkilememesi için)
                    context.shadowBlur = 0;
                }
            }
        });

        // --- 7.5 OVERLAY GİZLEME KONTROLÜ (BOŞTA KALMA DURUMU) ---
        // Saniyede bir kez ekranda hiç karakter kaldı mı kontrol et
        setInterval(() => {
            if (typeof Composite !== 'undefined' && typeof world !== 'undefined') {
                // Sahnede herhangi bir karakter (kral dahil) var mı kontrol et
                const activeCharBodies = Composite.allBodies(world).filter(b => b.label === 'karakter');
                const activeChars = activeCharBodies.length;

                // Silinmiş karakterlerin DOM elementlerini temizle (Memory leak önleme)
                const activeDomElements = activeCharBodies.map(b => b.plugin.domElement).filter(e => e);
                document.querySelectorAll('.custom-emote').forEach(el => {
                    if (!activeDomElements.includes(el)) {
                        el.remove();
                    }
                });

                // Toplu atlayış veya geri sayım modu aktifse ekran kapanmamalı
                const isWaitingGroupDrop = isDropTogetherMode || isMeteorMode || countdownTimerId !== null;

                // Eğer sahnede karakter/araç varsa veya geri sayım/toplu atlayış aktifse havuz açık kalsın
                if ((activeChars > 0 || activeVehicles > 0 || isWaitingGroupDrop) && isOverlayVisible) {
                    if (pool && pool.render && !pool.render.visible) pool.render.visible = true;
                    if (document.body.style.opacity !== '1') {
                        document.body.style.transition = 'none';
                        document.body.style.opacity = '1';
                    }
                }

                if (activeChars === 0 && activeVehicles === 0 && !isWaitingGroupDrop && isOverlayVisible) {
                    if (!overlayIdleTimerRef) {
                        overlayIdleTimerRef = setTimeout(() => {
                            overlayIdleTimerRef = null;
                            // Bu 5 saniye içinde yeni biri atladıysa veya geri sayım başladıysa gizleme
                            if (activeVehicles > 0 || isDropTogetherMode || isMeteorMode || countdownTimerId !== null || Composite.allBodies(world).some(b => b.label === 'karakter')) return;
                            isOverlayVisible = false;
                            document.body.style.transition = 'opacity 1.5s ease-in-out'; // Kaybolurken yumuşak kaybolsun
                            document.body.style.opacity = '0';
                            console.log("Sahne tamamen boşaldı, 5 saniye geçti, overlay gizleniyor.");

                            if (currentKing) {
                                if (currentKing.plugin.removeTimer) clearTimeout(currentKing.plugin.removeTimer);
                                Composite.remove(world, currentKing);
                                currentKing = null;
                            }

                            // 1.5 saniye sonra arkaplanı ve havuzu tamamen yok et
                            setTimeout(() => {
                                if (!isOverlayVisible) {
                                    document.body.style.backgroundImage = 'none';
                                    pool.render.visible = false;
                                }
                            }, 1500);
                        }, 5000); // 5 saniye bekle
                    }
                } else if ((activeChars > 0 || activeVehicles > 0 || isWaitingGroupDrop) && overlayIdleTimerRef) {
                    // Ekranda karakter varsa (veya araç uçuyorsa veya geri sayım bekleniyorsa) gizleme işlemini iptal et
                    clearTimeout(overlayIdleTimerRef);
                    overlayIdleTimerRef = null;
                }
            }
        }, 1000);

        // --- 7.6 SAHNE SERT SIFIRLAMA (!resetdrop) ---
        // Sayfayı yenilemiş gibi: ekrandaki tüm karakter, kral, havuz, uçak/helikopter silinir.
        // Sıralama (leaderboard) ve istatistikler (stats) KORUNUR.
        function hardResetScene() {
            sceneEpoch++; // Bekleyen tüm gecikmeli spawn/araç işlemlerini geçersiz kıl
            clearCountdown(); // Varsa aktif geri sayım zamanlayıcısını ve HUD'ını derhal durdur

            // Kalıcı objeler dışındaki her şeyi (karakterler, ip ağırlıkları vb.) fizik dünyasından sil
            const keep = [leftWall, rightWall, ground, pool];
            Composite.allBodies(world).forEach(b => {
                if (keep.includes(b)) return;
                if (b.plugin && b.plugin.removeTimer) clearTimeout(b.plugin.removeTimer);
                if (b.plugin && b.plugin.domElement) b.plugin.domElement.remove();
                Composite.remove(world, b);
            });
            Composite.allConstraints(world).forEach(c => Composite.remove(world, c));
            currentKing = null;
            trailParticles.length = 0;

            // DOM temizliği: emote'lar, uçak ve helikopterler
            document.querySelectorAll('.custom-emote, .droppool-vehicle').forEach(el => el.remove());
            if (typeof confetti === 'function' && confetti.reset) {
                try { confetti.reset(); } catch (e) { }
            }

            // Araç ve zamanlayıcı durumları
            activeVehicles = 0;
            isPlaneFlying = false;
            if (overlayIdleTimerRef) {
                clearTimeout(overlayIdleTimerRef);
                overlayIdleTimerRef = null;
            }

            // Overlay'i anında gizle (sayfa yenilenmiş gibi boş ekran)
            isOverlayVisible = false;
            document.body.style.transition = 'none';
            document.body.style.opacity = '0';
            document.body.style.backgroundImage = 'none';
            const bgLeft = document.getElementById('bg-left');
            const bgRight = document.getElementById('bg-right');
            if (bgLeft) bgLeft.remove();
            if (bgRight) bgRight.remove();
            pool.render.visible = false;
        }

        // --- 8. KICK WEBSOCKET (GERÇEK ZAMANLI BAĞLANTI) ---
        async function setupKickChatListener() {
            if (!usePlatKick || !channelName || channelName === 'testkanal') {
                console.log("Kick dinleyicisi atlandı (test kanalı veya Kick seçili değil).");
                return;
            }

            console.log(`Kick chat bağlantısı kuruluyor... Kanal: ${channelName}`);

            // --- Kick resmi API (webhook) ---
            // Worker (kick-api-worker/worker.js) deploy edildikten sonra adresini buraya yazın
            // ya da overlay linkine ?api=https://... ekleyin.
            const KICK_API_WORKER = (urlParams.get('api') || 'https://droppool-kick-api.crosweq204.workers.dev').replace(/\/$/, '');

            // Worker'ı kanal için abone ettir ve broadcaster_user_id'yi al
            let broadcasterId = null;
            let subscribeData = null;
            for (let attempt = 1; attempt <= 3 && !broadcasterId; attempt++) {
                try {
                    const res = await fetch(`${KICK_API_WORKER}/subscribe?channel=${encodeURIComponent(channelName)}`);
                    const data = await res.json();
                    if (data && data.id) {
                        broadcasterId = data.id;
                        subscribeData = data;
                        console.log('[Kick] Kanal abone edildi, broadcaster ID:', broadcasterId);
                    } else {
                        console.error('[Kick] Abonelik hatası:', data);
                    }
                } catch (e) {
                    console.warn('[Kick] Worker\'a ulaşılamadı, tekrar deneniyor...', e);
                }
                if (!broadcasterId) await new Promise(r => setTimeout(r, 2000 * attempt));
            }

            if (!broadcasterId) {
                console.error('[Kick] Broadcaster ID alınamadı. Worker adresi doğru mu? (README)');
                return;
            }

            try {
                // --- Canlı Pusher WebSocket Bağlantısı (Kotasız ve Anlık) ---
                const pusherConfig = (subscribeData && subscribeData.pusher) || {
                    key: 'f42163022b68a9746049',
                    cluster: 'eu',
                    channel: `droppool-${broadcasterId}`
                };

                console.log('[Kick] Pusher WebSocket bağlantısı kuruluyor...');
                const pusher = new Pusher(pusherConfig.key, {
                    cluster: pusherConfig.cluster,
                    forceTLS: true
                });

                pusher.connection.bind('connected', () => {
                    console.log('[Kick] Pusher WebSocket BAĞLANDI! Sohbet canlı dinleniyor...');
                });

                pusher.connection.bind('error', (err) => {
                    console.warn('[Kick Pusher Hatası]', err);
                });

                const kickChannel = pusher.subscribe(pusherConfig.channel);

                // Tüm eventleri logla (debug amaçlı)
                kickChannel.bind_global((eventName, rawData) => {
                    console.log('[Kick Event]', eventName, rawData);
                });

                kickChannel.bind('chat.message.sent', (rawData) => {
                    try {
                        // Bazen data string olarak gelir, bazen obje — ikisini de handle ediyoruz
                        let eventData = rawData;
                        if (typeof rawData === 'string') {
                            eventData = JSON.parse(rawData);
                        }
                        if (eventData && typeof eventData.data === 'string') {
                            eventData = JSON.parse(eventData.data);
                        }

                        if (!eventData) return;

                        const message = (eventData.content || '').trim();
                        const senderObj = eventData.sender || {};
                        const username = senderObj.username || (typeof eventData.sender === 'string' ? eventData.sender : null);
                        const senderUserId = senderObj.user_id || eventData.sender_user_id || null;
                        const isBroadcasterFlag = senderObj.is_broadcaster;
                        // is_admin bayrağını sadece imzalı webhook'u doğrulayan Worker üretir (ADMIN_KICK_USERS)
                        const isAdmin = senderObj.is_admin === true;


                        if (!message || !username) return;
                        processChat({ message, username, senderUserId, isBroadcasterFlag, isAdmin, broadcasterId, source: 'kick' });
                    } catch (e) {
                        console.error('Mesaj işlenirken hata:', e);
                    }
                });

            } catch (error) {
                console.error('Kick bağlantısı sırasında hata:', error);
            }
        }

        // --- ORTAK MESAJ İŞLEYİCİ (Kick ve Twitch aynı komut/atlayış mantığını kullanır) ---
        function processChat(ctx) {
                    try {
                        const { message, username, senderUserId, isBroadcasterFlag, isAdmin, broadcasterId } = ctx;
                        console.log(`[Chat${ctx.source ? ':' + ctx.source : ''}] ${username}: ${message}`);

                        // Yayıncı doğrulama (benzer isimli sahte hesaplara karşı sadece ID/bayrak güvenilir):
                        // 1. Kaynaktan gelen is_broadcaster bayrağı varsa sadece ona güvenilir
                        // 2. Sayısal Broadcaster ID eşleşmesi (sender.user_id === broadcasterId)
                        // 3. Eski worker (bayrak yok) için: birebir aynı kullanıcı adı
                        const isBroadcaster = () => {
                            if (typeof isBroadcasterFlag === 'boolean') return isBroadcasterFlag;
                            if (senderUserId && broadcasterId && String(senderUserId) === String(broadcasterId)) return true;
                            return Boolean(username && channelName && username.toLowerCase() === channelName.toLowerCase());
                        };
                        // Aktif oturumu sadece onu başlatan kişi (yayıncı ya da admin) kaldırabilir; diğerleri sıraya katılır.
                        const canLaunch = () => (modeOwner === 'admin') ? isAdmin : isBroadcaster();
                        const lowerMsg = message.toLowerCase();

                        const doReset = (tag) => {
                            clearCountdown();
                            userCooldowns.clear();
                            isDropTogetherMode = false;
                            isMeteorMode = false;
                            modeOwner = null;
                            dropTogetherQueue = [];
                            hardResetScene(); // Ekrandaki her şeyi sayfa yenilenmiş gibi temizle (sıralama korunur)
                            addDropPoolLog(username, 'SİSTEM', `${tag} ile tüm süreleri ve sıralamayı sıfırladı.`);
                            console.log(`[DropPool] ${tag} komutu alındı — bekleme süreleri sıfırlandı, toplu atlama iptal edildi ve sahne temizlendi.`);
                        };

                        // kind: 'plane' | 'meteor'. byAdmin: komutu admin mi yazdı.
                        // durationSec: 0 ise manuel mod, > 0 ise belirtilen saniye sonra otomatik atlayış.
                        // Kurallar:
                        //  - Yayıncının açtığı oturum aktifken admin komutu sayılmaz.
                        //  - Aynı sahibin aynı modu tekrar yazması:
                        //      * Eğer yeni bir süre (durationSec > 0) verildiyse süreyi günceller (sıra korunur).
                        //      * Süre verilmediyse etkisizdir (liste sıfırlanmaz, uçak kalkmaz).
                        //  - Yayıncı, admin oturumunun üzerine yazarsa oturumu devralır; sıradakiler korunur.
                        const startMode = (kind, tag, byAdmin, durationSec = 0) => {
                            const owner = byAdmin ? 'admin' : 'broadcaster';
                            const active = isDropTogetherMode || isMeteorMode;
                            const sameKind = (kind === 'meteor') ? isMeteorMode : isDropTogetherMode;

                            if (byAdmin && active && modeOwner === 'broadcaster') {
                                console.log(`[DropPool] ${tag} yok sayıldı: yayıncının başlattığı oturum aktif.`);
                                return;
                            }

                            // Aynı sahip aynı modu tekrar yazdı
                            if (active && modeOwner === owner && sameKind) {
                                if (durationSec > 0) {
                                    clearCountdown();
                                    countdownTargetEpoch = sceneEpoch;
                                    countdownModeKind = kind;
                                    countdownByAdmin = byAdmin;
                                    countdownInitiator = username;

                                    countdownTimerId = setTimeout(() => {
                                        countdownTimerId = null;
                                        if (countdownTargetEpoch !== sceneEpoch) return;
                                        executeAutoDrop(kind, byAdmin, username);
                                    }, durationSec * 1000);

                                    addDropPoolLog(username, 'SİSTEM', `${tag} süresi ${durationSec} saniye olarak güncellendi.`);
                                    console.log(`[DropPool] ${tag} süresi ${durationSec}s olarak güncellendi. (Sıra korundu, uzunluk: ${dropTogetherQueue.length})`);
                                    return;
                                }
                                console.log(`[DropPool] ${tag} tekrar yazıldı, mod zaten aktif — yok sayıldı. Başlatmak için atlama komutunu yazın.`);
                                return;
                            }

                            // Önceki sayaç varsa durdur
                            clearCountdown();

                            const takeover = !byAdmin && active && modeOwner === 'admin';
                            isDropTogetherMode = (kind === 'plane');
                            isMeteorMode = (kind === 'meteor');
                            modeOwner = owner;
                            if (!takeover) dropTogetherQueue = [];
                            userCooldowns.clear();

                            // Eğer süre verildiyse arka planda süreli atlayışı başlat (ekranda sayaç gösterilmez)
                            if (durationSec > 0) {
                                countdownTargetEpoch = sceneEpoch;
                                countdownModeKind = kind;
                                countdownByAdmin = byAdmin;
                                countdownInitiator = username;

                                countdownTimerId = setTimeout(() => {
                                    countdownTimerId = null;
                                    if (countdownTargetEpoch !== sceneEpoch) return;
                                    executeAutoDrop(kind, byAdmin, username);
                                }, durationSec * 1000);
                            }

                            const logMsg = durationSec > 0
                                ? (takeover ? `${tag} ${durationSec}s ile admin oturumunu devraldı (${durationSec}s otomatik).` : `${tag} ${durationSec}s modunu aktif etti (${durationSec} sn sonra otomatik atlayış).`)
                                : (takeover ? `${tag} ile admin oturumunu devraldı (sıra korundu).` : `${tag} modunu aktif etti.`);

                            addDropPoolLog(username, 'SİSTEM', logMsg);
                            console.log(`[DropPool] ${kind === 'meteor' ? 'Meteor Yağmuru' : 'Toplu atlayış (Drop Together)'} modu AKTİF (${owner})${durationSec > 0 ? ` [${durationSec}s sayaç]` : ''}${takeover ? ' — devralındı, sıra korundu' : ''}. İzleyiciler sıraya alınıyor.`);
                        };

                        // Sıfırlama komutları: !resetdrop ve !adminresetdrop
                        if (lowerMsg === '!resetdrop' || lowerMsg.startsWith('!resetdrop ')) {
                            if (isBroadcaster()) {
                                doReset('!resetdrop');
                                return;
                            }
                            console.warn(`[DropPool] !resetdrop reddedildi: ${username} yayıncı olarak doğrulanamadı (is_broadcaster=${isBroadcasterFlag}, user_id=${senderUserId}, broadcasterId=${broadcasterId}).`);
                        }
                        if ((lowerMsg === '!adminresetdrop' || lowerMsg.startsWith('!adminresetdrop ')) && isAdmin) {
                            doReset('!adminresetdrop');
                            return;
                        }

                        // Toplu atlayış ve meteor komutları (isteğe bağlı saniye parametreli: !droptogether 100, !admindroptogether 20 vb.)
                        const modeCmdMatch = lowerMsg.match(/^!(droptogether|admindroptogether|meteor|adminmeteor)(?:\s+(\d+)(?:s|sn|sec)?)?$/);
                        if (modeCmdMatch) {
                            const cName = modeCmdMatch[1];
                            const dur = modeCmdMatch[2] ? parseInt(modeCmdMatch[2], 10) : 0;

                            if (cName === 'droptogether' && isBroadcaster()) {
                                startMode('plane', '!droptogether', false, dur);
                                return;
                            }
                            if (cName === 'meteor' && isBroadcaster()) {
                                startMode('meteor', '!meteor', false, dur);
                                return;
                            }
                            if (cName === 'admindroptogether' && isAdmin) {
                                startMode('plane', '!admindroptogether', true, dur);
                                return;
                            }
                            if (cName === 'adminmeteor' && isAdmin) {
                                startMode('meteor', '!adminmeteor', true, dur);
                                return;
                            }
                        }

                        const msgLower = message.toLowerCase();
                        const cmdLower = commandStr.toLowerCase();
                        const altCmd = '!drop';

                        // Dive komutu kontrolü
                        let isDiveCommand = false;
                        let isNormalDropCommand = false;
                        let isDrunkCommand = false;
                        let isTarzanCommand = false;
                        let isFakeCommand = false;

                        const _checkCmd = (base) => [
                            [base + ' fake', base + 'fake', base + ' fake ', base + 'fake ', base + ' fake[', base + 'fake[', base + ' fake [', base + 'fake ['],
                            [base + ' dive', base + 'dive', base + ' dive ', base + 'dive ', base + ' dive[', base + 'dive[', base + ' dive [', base + 'dive ['],
                            [base + ' drunk', base + 'drunk', base + ' drunk ', base + 'drunk ', base + ' drunk[', base + 'drunk[', base + ' drunk [', base + 'drunk ['],
                            [base + ' tarzan', base + 'tarzan', base + ' tarzan ', base + 'tarzan ', base + ' tarzan[', base + 'tarzan[', base + ' tarzan [', base + 'tarzan ['],
                            [base + ' random', base + 'random', base + ' random ', base + 'random ', base + ' random[', base + 'random[', base + ' random [', base + 'random ['],
                            [base + ' ', base + ' [', base + '[', base]
                        ];

                        const _matchVariant = (base) => {
                            const sets = _checkCmd(base);
                            for (let si = 0; si < sets.length; si++) {
                                const s = sets[si];
                                for (let j = 0; j < s.length; j++) {
                                    const pat = s[j];
                                    // Boşluk, '[' veya ' [' ile biten kalıplar → startsWith ile kontrol et
                                    if (pat.endsWith('[') || pat.endsWith(' ') || pat.endsWith(' [') ? msgLower.startsWith(pat) : msgLower === pat) {
                                        return si;
                                    }
                                }
                            }
                            return -1;
                        };

                        let variantIdx = _matchVariant(cmdLower);
                        if (variantIdx === -1 && cmdLower !== altCmd) variantIdx = _matchVariant(altCmd);

                        if (variantIdx === 0) {
                            isFakeCommand = true;
                        } else if (variantIdx === 1) {
                            isDiveCommand = true;
                        } else if (variantIdx === 2) {
                            isDrunkCommand = true;
                        } else if (variantIdx === 3) {
                            isTarzanCommand = true;
                        } else if (variantIdx === 4) {
                            const r = Math.floor(Math.random() * 5);
                            if (r === 0) isNormalDropCommand = true;
                            else if (r === 1) isDiveCommand = true;
                            else if (r === 2) isDrunkCommand = true;
                            else if (r === 3) isTarzanCommand = true;
                            else if (r === 4) isFakeCommand = true;
                        } else if (variantIdx === 5) {
                            isNormalDropCommand = true;
                        }

                        if (isDiveCommand || isDrunkCommand || isTarzanCommand || isFakeCommand || isNormalDropCommand) {
                            if (checkCooldown(username)) {
                                let customEmoteUrl = ctx.emoteUrl || null;
                                // Kick emote yapısını tespit et: [emote:12345:EmoteName]
                                const emoteMatch = customEmoteUrl ? null : message.match(/\[emote:(\d+):.*?\]/i);
                                if (emoteMatch) {
                                    const emoteId = emoteMatch[1];
                                    customEmoteUrl = `https://files.kick.com/emotes/${emoteId}/fullsize`;
                                }

                                if (isDropTogetherMode || isMeteorMode) {
                                    // Toplu atlayışta dive dahil tüm özel komutlar yoksayılır ve default atlayış yapılır. (Emote hariç)
                                    if (canLaunch()) {
                                        // Oturumu başlatan kişi atlarsa modu kapat ve aksiyonu başlat
                                        let currentMode = isMeteorMode ? 'meteor' : 'plane';
                                        isDropTogetherMode = false;
                                        isMeteorMode = false;
                                        modeOwner = null;
                                        clearCountdown(); // Varsa aktif geri sayımı derhal iptal et
                                        if (!dropTogetherQueue.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                                            dropTogetherQueue.unshift({ username, customEmoteUrl, isDrunk: false, isTarzan: false, isFake: false });
                                            addDropPoolLog(username, 'SİSTEM', currentMode === 'meteor' ? 'Meteor yağmuru başlattı!' : 'Toplu atlayış (Uçak) başlattı!');
                                            updateDropPoolStats(username, 'JUMP');
                                        }
                                        if (currentMode === 'meteor') {
                                            triggerMeteorShower();
                                        } else {
                                            triggerPlaneDrop();
                                        }
                                    } else {
                                        // İzleyici atlarsa sıraya ekle (isDrunk, isTarzan, isFake her zaman false)
                                        if (!dropTogetherQueue.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                                            dropTogetherQueue.push({ username, customEmoteUrl, isDrunk: false, isTarzan: false, isFake: false });
                                            addDropPoolLog(username, 'SİSTEM', isMeteorMode ? 'Meteor yağmuru için sıraya girdi.' : 'Toplu atlayış (Uçak) için sıraya girdi.');
                                            updateDropPoolStats(username, 'JUMP');
                                            console.log(`[DropPool] Sıraya eklendi: ${username}. (Sıra uzunluğu: ${dropTogetherQueue.length})`);
                                        } else {
                                            console.log(`[DropPool] ${username} zaten sırada.`);
                                        }
                                    }
                                } else {
                                    if (isDiveCommand) {
                                        // Dalış modu (helikopter)
                                        addDropPoolLog(username, 'ATLAYIŞ', 'Özel atlayış (Helikopter) başlattı.');
                                        updateDropPoolStats(username, 'JUMP');
                                        triggerHelicopterDrop(username, customEmoteUrl);
                                    } else {
                                        // Normal, drunk, tarzan veya fake modda doğrudan düşür
                                        let tip = 'Normal';
                                        if (isDrunkCommand) tip = 'Sarhoş';
                                        if (isTarzanCommand) tip = 'Tarzan';
                                        if (isFakeCommand) tip = 'Sahte';
                                        addDropPoolLog(username, 'ATLAYIŞ', `${tip} atlayış başlattı.`);
                                        updateDropPoolStats(username, 'JUMP');
                                        spawnCharacter(username, customEmoteUrl, null, -50, false, isDrunkCommand, isTarzanCommand, isFakeCommand);
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.error('Mesaj işlenirken hata:', e);
                    }
        }

        // --- 8.1 TWITCH CHAT (Anonim IRC WebSocket — sunucu/worker gerektirmez, tarayıcıdan doğrudan bağlanır) ---
        function setupTwitchChatListener() {
            if (!useTwitch || !twitchChannelName) return;
            console.log(`[Twitch] Chat bağlantısı kuruluyor... Kanal: ${twitchChannelName}`);
            let ws = null;
            let retry = 0;

            const parseTags = (raw) => {
                const tags = {};
                raw.split(';').forEach(p => {
                    const i = p.indexOf('=');
                    if (i > 0) tags[p.slice(0, i)] = p.slice(i + 1);
                });
                return tags;
            };

            const handleLine = (line) => {
                if (!line) return;
                if (line.startsWith('PING')) { ws.send('PONG ' + line.slice(5)); return; }
                let tags = {};
                let rest = line;
                if (rest.startsWith('@')) {
                    const sp = rest.indexOf(' ');
                    tags = parseTags(rest.slice(1, sp));
                    rest = rest.slice(sp + 1);
                }
                // :nick!nick@nick.tmi.twitch.tv PRIVMSG #kanal :mesaj
                const m = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :([\s\S]*)$/);
                if (!m) return;
                let message = m[2].trim();
                const actionMatch = message.match(/^\u0001ACTION ([\s\S]*?)\u0001?$/);
                if (actionMatch) message = actionMatch[1].trim();
                const login = m[1];
                const username = (tags['display-name'] || login || '').replace(/\\s/g, ' ').trim();
                if (!message || !username) return;

                // Twitch emote: emotes=ID:0-4,6-10/ID2:12-15 → ilk emote'un görseli
                let emoteUrl = null;
                if (tags['emotes']) {
                    const firstId = tags['emotes'].split('/')[0].split(':')[0];
                    if (firstId) emoteUrl = `https://static-cdn.jtvnw.net/emoticons/v2/${firstId}/default/dark/3.0`;
                }
                const isBroadcasterFlag = (tags['badges'] || '').split(',').some(b => b.startsWith('broadcaster/'));

                processChat({
                    message,
                    username,
                    senderUserId: tags['user-id'] || null,
                    isBroadcasterFlag,
                    isAdmin: false, // Admin yetkisi sadece Kick Worker üzerinden doğrulanır
                    broadcasterId: tags['room-id'] || null,
                    emoteUrl,
                    source: 'twitch'
                });
            };

            const connect = () => {
                try {
                    ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                } catch (e) {
                    console.warn('[Twitch] WebSocket açılamadı:', e);
                    setTimeout(connect, 5000);
                    return;
                }
                ws.onopen = () => {
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    ws.send('PASS SCHMOOPIIE');
                    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 89999));
                    ws.send('JOIN #' + twitchChannelName);
                    retry = 0;
                    console.log('[Twitch] IRC BAĞLANDI! Sohbet canlı dinleniyor...');
                };
                ws.onmessage = (ev) => {
                    String(ev.data).split('\r\n').forEach(l => {
                        try { handleLine(l); } catch (e) { console.error('[Twitch] Mesaj işlenirken hata:', e); }
                    });
                };
                ws.onclose = () => {
                    retry++;
                    const wait = Math.min(30000, 2000 * retry);
                    console.warn(`[Twitch] Bağlantı koptu, ${wait / 1000}s sonra yeniden denenecek.`);
                    setTimeout(connect, wait);
                };
                ws.onerror = () => { try { ws.close(); } catch (e) { } };
            };
            connect();
        }

        // --- HELİKOPTER (DIVE) ANİMASYONU ---
        function triggerHelicopterDrop(username, customEmoteUrl, forcedHeliNo = null) {
            activeVehicles++; // Araç sayısını artır
            const epoch = sceneEpoch;

            // Eğer ekran kapalıysa arka planı uyandır
            if (!isOverlayVisible) {
                isOverlayVisible = true;
                pool.render.visible = true;
                applyRandomTheme();
                document.body.style.transition = 'none';
                document.body.style.opacity = '1';
            }
            resetIdleTimer();

            // forcedHeliNo varsa onu kullan, yoksa 1-9 arası rastgele helikopter seç
            const heliNo = forcedHeliNo !== null ? forcedHeliNo : Math.floor(Math.random() * 9) + 1;

            const heli = document.createElement('img');
            heli.className = 'droppool-vehicle';
            heli.src = `Helicopter${heliNo}.png`;
            heli.style.position = 'absolute';
            heli.style.top = isSmallPool ? '12px' : '20px'; // 20 * 0.6
            heli.style.left = '-500px';
            heli.style.width = isSmallPool ? '270px' : '450px'; // 450 * 0.6
            heli.style.zIndex = '100';
            heli.style.transition = 'left 5s linear';
            heli.style.animation = 'heliBobbing 3.5s infinite ease-in-out';
            document.body.appendChild(heli);

            setTimeout(() => {
                heli.style.left = (window.innerWidth + 500) + 'px';
            }, 50);

            const startDropX = window.innerWidth * 0.15;
            const endDropX = window.innerWidth * 0.85;

            const totalDistance = window.innerWidth + 1000; // -500 to w+500
            const speed = totalDistance / 5000;

            const timeToStart = (startDropX - (-500)) / speed;
            const timeToEnd = (endDropX - (-500)) / speed;
            const safeDuration = timeToEnd - timeToStart;

            // Rastgele bir bırakma zamanı belirle (güvenli alan içinde)
            const randomDropOffset = Math.random() * safeDuration;
            const dropTime = timeToStart + randomDropOffset;
            const expectedX = -500 + (speed * dropTime);

            setTimeout(() => {
                if (epoch !== sceneEpoch) return; // !resetdrop ile iptal edildi
                // Helikopterin (450px) alt merkezinden düşsün (expectedX + 225). Helikopter yukarı çıktığı için Y=120 oldu.
                spawnCharacter(username, customEmoteUrl, expectedX + 225, 120, true);
            }, dropTime);

            setTimeout(() => {
                if (heli.parentNode) heli.parentNode.removeChild(heli);
                if (epoch !== sceneEpoch) return; // Sayaç zaten sıfırlandı
                activeVehicles--; // Araç sayısını azalt
            }, 5000);
        }

        // --- TOPLU ATLAYIŞ UÇAK ANİMASYONU ---
        function triggerPlaneDrop() {
            if (dropTogetherQueue.length === 0) return;

            activeVehicles++; // Araç sayısını artır
            isPlaneFlying = true;
            const epoch = sceneEpoch;

            // Eğer ekran kapalıysa arka planı uyandır
            wakeOverlay();
            resetIdleTimer();

            // Uçak görselini oluştur
            const plane = document.createElement('img');
            plane.className = 'droppool-vehicle';
            if (typeof channelName !== 'undefined' && channelName.toLowerCase() === 'kafamkinder') {
                plane.src = 'kinderplane2.png';
            } else {
                plane.src = 'plane1.png';
            }
            plane.style.position = 'absolute';
            plane.style.top = isSmallPool ? '30px' : '50px'; // 50 * 0.6
            plane.style.left = '-550px'; // Uçak daha da büyük olduğu için daha soldan başlasın
            plane.style.width = isSmallPool ? '300px' : '500px'; // 500 * 0.6
            plane.style.zIndex = '100';
            plane.style.transition = 'left 5s linear';
            // Havacılık hissi için sağa doğru ilerlerken düz durmasını sağla (Görsel yönüne göre değiştirebilirsiniz)
            document.body.appendChild(plane);

            // Frame güncellenmesi için ufacık bekleyip uçağı hareket ettiriyoruz
            setTimeout(() => {
                plane.style.left = (window.innerWidth + 550) + 'px';
            }, 50);

            // Uçak geçerken ekranın güvenli X alanında (örneğin %15 ile %85 arası) karakterleri bırakıcak
            const startDropX = window.innerWidth * 0.15;
            const endDropX = window.innerWidth * 0.85;

            const totalDistance = window.innerWidth + 1100; // -550'den w+550'e (5 saniyede)
            const speed = totalDistance / 5000; // px per ms

            const timeToStart = (startDropX - (-550)) / speed;
            const timeToEnd = (endDropX - (-550)) / speed;
            const safeDuration = timeToEnd - timeToStart;

            const usersToDrop = [...dropTogetherQueue];
            dropTogetherQueue = [];

            const intervalTime = safeDuration / Math.max(1, usersToDrop.length);

            // Tüm kullanıcıları uçağın o anki tahmini pozisyonunda spawn et
            usersToDrop.forEach((user, index) => {
                const dropTime = timeToStart + (intervalTime * index);
                const expectedX = -550 + (speed * dropTime);

                setTimeout(() => {
                    if (epoch !== sceneEpoch) return; // !resetdrop ile iptal edildi
                    // Uçağın gövde alt merkezinden düşsünler
                    spawnCharacter(user.username, user.customEmoteUrl, expectedX + (500 / 2), 150, false, user.isDrunk, user.isTarzan, user.isFake);
                }, dropTime);
            });

            // 5 saniye sonra uçağı domdan temizle
            setTimeout(() => {
                if (plane.parentNode) plane.parentNode.removeChild(plane);
                if (epoch !== sceneEpoch) return; // Durum zaten sıfırlandı
                isPlaneFlying = false;
                activeVehicles--; // Araç sayısını azalt
            }, 5000);
        }

        };

        // Uçağı test etmek için otomatik çalıştırıyoruz
        // window.testKinderPlane();

        // --- DOĞUM GÜNÜ PARTİ TEST SENARYOSU ---
        window.testMeteor = () => {
            console.log("Meteor yağmuru test senaryosu başlatıldı.");
            dropTogetherQueue = [
                { username: "Meteor1", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true },
                { username: "Meteor2", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true },
                { username: "Meteor3", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true },
                { username: "Meteor4", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true },
                { username: "Meteor5", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true },
                { username: "Yayıncı", customEmoteUrl: null, isDrunk: false, isTarzan: false, isFake: false, isMeteor: true }
            ];
            triggerMeteorShower();
        };

        function triggerMeteorShower() {
            wakeOverlay();
            activeVehicles++; // Ekran kapanmasın diye aktif araç sayısını artır
            const epoch = sceneEpoch;
            let spawnDelay = 0;
            const usersToSpawn = [...dropTogetherQueue];
            dropTogetherQueue = [];

            // Herkesin aynı açıyla düşmesi için bu yağmura özel ortak bir X ve Y hızı belirliyoruz.
            // Hızı %10 daha düşürdük.
            let sharedVx = (Math.random() - 0.5) * 3.888;
            let sharedVy = 5.832 + Math.random() * 2.916;

            // Sırayı karıştır ki rastgele düşsünler
            usersToSpawn.sort(() => Math.random() - 0.5);

            usersToSpawn.forEach((user, index) => {
                setTimeout(() => {
                    if (epoch !== sceneEpoch) return; // !resetdrop ile iptal edildi
                    spawnCharacter(user.username, user.customEmoteUrl, null, -50, false, false, false, false, true, sharedVx, sharedVy);
                    if (index === usersToSpawn.length - 1) {
                        setTimeout(() => {
                            if (epoch !== sceneEpoch) return; // Sayaç zaten sıfırlandı
                            activeVehicles = Math.max(0, activeVehicles - 1);
                        }, 3000);
                    }
                }, spawnDelay);

                spawnDelay += Math.random() * 200 + 100; // 0.1s ile 0.3s arası rastgele aralıklarla fırlat
            });
        }

        window.testParty = () => {
            console.log("Party test senaryosu başlatıldı. Her 2 saniyede bir karakter atlayacak.");
            let testCounter = 1;

            // İlk atlayışı anında yap
            spawnCharacter(`TestKullanicisi${testCounter}`, null, null, -50, false, false, false);

            // Ardından her 2 saniyede bir atlat
            setInterval(() => {
                testCounter++;
                spawnCharacter(`TestKullanicisi${testCounter}`, null, null, -50, false, false, false);
            }, 2000);
        };

        // Kullanıcının isteği üzerine testi anında başlatıyoruz:
