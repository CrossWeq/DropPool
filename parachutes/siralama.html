<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atla Sıralaması (OBS Overlay)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 16px;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.9);
        }

        .lb-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            padding-bottom: 5px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            display: inline-block;
        }

        .lb-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .lb-row {
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="leaderboard-container">
        <div class="lb-title">Atla Sıralaması</div>
        <div class="lb-list" id="leaderboard-list">
            <!-- Dinamik doldurulacak -->
        </div>
    </div>

    <script>
        const syncChannel = new BroadcastChannel('droppool_channel');
        let leaderboard = [];

        function getScoreColor(num) {
            if (num < 90) return '#22c55e'; // 90 altı: Yeşil
            if (num <= 95) return '#facc15'; // 90 - 95: Sarı
            return '#ef4444'; // 95 - 100: Kırmızı
        }

        function renderLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;

            let html = '';
            for (let i = 0; i < 5; i++) {
                const item = leaderboard[i];
                const rankNum = (i + 1) + '-';
                if (item) {
                    const num = parseFloat(item.score);
                    const color = getScoreColor(num);
                    const star = num >= 95 ? ' ⭐' : '';
                    
                    // 15 karakterden uzunsa kısalt ve sonuna '...' ekle
                    const displayName = item.username.length > 15 
                        ? item.username.substring(0, 15) + '...' 
                        : item.username;

                    html += `<div class="lb-row">${rankNum} ${displayName} <span style="color: ${color}; font-weight: 800;">${num.toFixed(2)}${star}</span></div>`;
                } else {
                    html += `<div class="lb-row">${rankNum}</div>`;
                }
            }
            listEl.innerHTML = html;
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem('droppool_leaderboard');
                if (data) {
                    leaderboard = JSON.parse(data);
                } else {
                    leaderboard = [];
                }
            } catch (e) {
                leaderboard = [];
            }
            renderLeaderboard();
        }

        // BroadcastChannel üzerinden anlık güncelleme dinle
        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'LEADERBOARD_UPDATE') {
                leaderboard = event.data.leaderboard || [];
                renderLeaderboard();
            } else if (event.data && event.data.type === 'LEADERBOARD_RESET') {
                leaderboard = [];
                renderLeaderboard();
            }
        };

        // localStorage değişikliklerini de dinle
        window.addEventListener('storage', (event) => {
            if (event.key === 'droppool_leaderboard') {
                loadFromStorage();
            }
        });

        // Sayfa ilk açıldığında verileri yükle
        loadFromStorage();
    </script>
</body>

</html>
